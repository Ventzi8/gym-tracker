function setHead(ex, u) {
  const m = Engine.modeOf(ex), each = ex.perHand ? ' / hand' : '', side = ex.perSide ? ' / leg' : '';
  if (m === 'timed') return ['Time it', 'Seconds'];
  if (m === 'assisted') return [`Assist ${u}`, 'Reps'];
  if (m === 'bodyweight') return [`+${u}${each}`, `Reps${side}`];
  return [`${u}${each}`, `Reps${side}`];
}

function renderExerciseCard(w, en, i) {
  const S = Store.state; const ex = Store.exercise(en.ex);
  if (!ex) return '';
  const u = S.settings.units; const m = Engine.modeOf(ex);
  const ev = Engine.evaluate(ex, Store.history(ex.id, { excludeId: w.id, before: w.date }), S.settings, w.readiness);
  const words = Engine.describe(ev, u);
  const si = Engine.scoreInfo(ex, u);
  const lastSets = ev.last ? ev.last.sets : null;
  const tg = Engine.exTargets(ex, S.settings);
  const col = DAY_TYPES[ex.day]?.color || 'var(--pink)';
  const alts = (ex.alts || []).map(a => Store.exercise(a)).filter(Boolean);
  const [hw, hr] = setHead(ex, u);
  const noW = !!ex.levels && m === 'bodyweight';   // the version row replaces the weight column
  const trend = ev.trend ? ` <span class="trend ${ev.trend > 0 ? 'up' : 'down'}">${ev.trend > 0 ? '▲' : '▼'} ${Math.abs(ev.trend).toFixed(0)}%</span>` : '';
  let html = `<article class="card ex" data-entry="${i}" style="--hl:${col};animation-delay:${Math.min(i, 8) * 45}ms">
    <div class="head"><button class="stamp" data-act="show-muscles" data-ex="${ex.id}" aria-label="Muscles worked by ${esc(ex.name)}">${Body.svg({ primary: ex.primary, secondary: ex.secondary, hl: col, label: ex.name + ' muscles' })}</button>
      <div class="grow"><div class="row between" style="align-items:flex-start"><div class="name">${esc(ex.name)}</div><div class="tools">${alts.length ? `<button class="icon-btn" data-act="swap" data-e="${i}" title="Swap for ${esc(alts.map(a => a.name).join(' / '))}" aria-label="Swap exercise">${ICON.swap}</button>` : ''}<button class="icon-btn" data-act="ex-menu" data-e="${i}" aria-label="Exercise options">${ICON.more}</button></div></div>
      <div class="muscles">${muscleNames(ex.primary).join(' · ')}${ex.secondary.length ? ` <span class="faint">· ${muscleNames(ex.secondary).join(' · ')}</span>` : ''}</div>
      <div class="last">${ev.last ? `<span>Last <b>${Engine.loadText(ex, ev.w, u)}</b> ${ev.last.repsText}</span><span>${si.short} <b>${si.fmt(ev.score)}</b>${trend}</span><span class="muted">${D.fmtShort(ev.lastDate)}</span>` : `<span class="muted">No history yet${m === 'load' && ex.weight ? ` · starting at ${fmtW(ex.weight)} ${u}` : ''}</span>`}</div>
    </div></div>
    <div class="reco ${ev.status}"><span class="ic">${STATUS_ICON[ev.status]}</span><div class="grow"><div class="t">${esc(words.title)}</div><div class="d">${esc(words.detail)}</div></div>${['increase', 'almost', 'hold', 'newload'].includes(ev.status) ? `<span class="streak" title="2-for-2 progress"><i class="${ev.streak >= 1 ? 'on' : ''}"></i><i class="${ev.streak >= 2 ? 'on' : ''}"></i></span>` : ''}</div>
    ${ex.levels ? `<div class="lvlrow"><span class="lbl">Version</span><div class="stepper lvl"><button data-lvl="-1" aria-label="Easier version">−</button><span class="lvlname">${esc(Engine.loadText(ex, (en.sets[0] || {}).w))}</span><button data-lvl="1" aria-label="Harder version">+</button></div></div>` : ''}
    <div class="sets"><div class="sethead${noW ? ' wide' : ''}"><span>Set</span>${noW ? '' : `<span>${hw}</span>`}<span>${hr}</span><span></span></div>`;
  const sets = en.sets || [];
  sets.forEach((s, si2) => {
    const isLast = si2 === sets.length - 1 && sets.length > 1;
    const ph = lastSets && lastSets[si2] ? lastSets[si2].r : (isLast ? tg.top : tg.target);
    const wPh = m === 'load' || m === 'assisted' ? (ev.sessions ? fmtW(ev.w) : (ex.weight ? fmtW(ex.weight) : u)) : 'BW';
    const wCell = noW ? '' : m === 'timed'
      ? `<button class="holdbtn" data-act="hold" aria-label="Time set ${si2 + 1}">${ICON.play}<span>Time</span></button>`
      : `<div class="stepper"><button data-step="w" data-n="-1" aria-label="Less">−</button><input type="number" inputmode="decimal" step="0.5" min="0" value="${s.w === '' || s.w == null ? '' : s.w}" placeholder="${wPh}" data-f="w" aria-label="${hw} set ${si2 + 1}"><button data-step="w" data-n="1" aria-label="More">+</button></div>`;
    html += `<div class="set${s.done ? ' isdone' : ''}${noW ? ' wide' : ''}" data-s="${si2}">
      <div class="n">${si2 + 1}${isLast ? '<small>All out</small>' : ''}</div>
      ${wCell}
      <div class="stepper"><button data-step="r" data-n="-1" aria-label="Fewer">−</button><input type="number" inputmode="numeric" step="1" min="0" value="${s.r === '' || s.r == null ? '' : s.r}" placeholder="${ph}" data-f="r" aria-label="${hr} set ${si2 + 1}"><button data-step="r" data-n="1" aria-label="More">+</button></div>
      <button class="done${s.done ? ' on' : ''}" data-act="set-done" aria-label="Set ${si2 + 1} done" aria-pressed="${!!s.done}">${ICON.check}</button>
    </div>
    <div class="setrir" data-s="${si2}"><span class="lbl">RIR</span><div class="rir">` + [0, 1, 2, 3, 4].map(v => `<button class="${+s.rir === v ? 'on' : ''}" data-v="${v}" data-act="rir" title="${v === 0 ? 'Nothing left' : v + ' more possible'}">${v === 4 ? '4+' : v}</button>`).join('') + `</div></div>`;
  });
  html += `<div class="live small muted" data-live>${liveLine(ex, en, S.settings)}</div></div>
    <div class="exfoot"><button class="btn sm ghost" data-act="add-set">${ICON.plus} Set</button><button class="btn sm ghost" data-act="remove-set" ${sets.length <= 1 ? 'disabled' : ''}>${ICON.minus} Set</button><button class="btn sm ghost" data-act="toggle-note">Note</button></div>
    <div class="exnote${en.note || en._noteOpen ? '' : ' hidden'}"><input class="input" data-f="note" placeholder="Seat setting, knee or full version, how it felt…" value="${esc(en.note || '')}"></div>
  </article>`;
  return html;
}

function liveLine(ex, en, settings) {
  const t = Engine.exTargets(ex, settings); const m = Engine.modeOf(ex); const unit = Engine.repUnit(ex);
  let st = Engine.sessionStats(ex, en.sets, settings);
  if (!st) return m === 'timed' ? `Tap ▶ Time on a set, hold, then Stop — the seconds fill in by themselves.` : `Log your sets — working sets aim for ${t.target}, final set as many as you can.`;
  // same "big jump" rule as the advice: light machine loads need 3 extra reps before moving up
  if (m === 'load' && st.w > 0 && t.step / st.w > 0.12) st = Engine.sessionStats(ex, en.sets, settings, t.top + 3);
  const si = Engine.scoreInfo(ex, settings.units);
  const parts = [`Working ${st.workHit ? '✓' : '·'} ${st.work.map(s => s.r).join('/')}${unit} vs ${t.target}${unit}`];
  if (st.n > 1) parts.push(`final ${st.finalHit ? '✓' : '·'} ${st.last.r}${unit} vs ${st.top}${unit}`);
  parts.push(`${si.short} ${si.fmt(st.score)}`);
  const verdict = st.hit ? '<b style="color:var(--ok)">counts toward the 2-for-2</b>' : st.under ? '<b style="color:var(--warn)">under the floor</b>' : 'in the zone — keep going';
  return parts.join(' · ') + ' → ' + verdict;
}

/* summary sheet after finishing */
function summaryHTML(w) {
  const S = Store.state; const t = DAY_TYPES[w.type]; const u = S.settings.units;
  const prim = new Set(), sec = new Set(); let rows = '';
  (w.entries || []).forEach(en => {
    const ex = Store.exercise(en.ex); if (!ex) return;
    const st = Engine.sessionStats(ex, en.sets, S.settings); if (!st) return;
    ex.primary.forEach(m => prim.add(m)); ex.secondary.forEach(m => sec.add(m));
    const ev = Engine.evaluate(ex, Store.history(ex.id, { includeOpen: true, before: w.date }), S.settings);
    const wd = Engine.describe(ev, u); const si = Engine.scoreInfo(ex, u);
    rows += `<div class="item"><div><div class="n">${esc(ex.name)}</div><div class="s">${Engine.loadText(ex, st.w, u)} · ${st.repsText} · ${si.short} ${si.fmt(st.score)}${ev.isPR ? ' · <b style="color:var(--ok)">new best</b>' : ''}</div><div class="s">${esc(wd.title)}</div></div><span class="badge ${ev.status}">${STATUS_LABEL[ev.status]}</span></div>`;
  });
  if (w.cardio && +w.cardio.min > 0) rows += `<div class="item"><div><div class="n">${esc(w.cardio.kind || 'Cardio')} · ${w.cardio.min} min</div><div class="s">${w.cardio.rpe ? `RPE ${w.cardio.rpe} · ` : ''}${w.stretch && w.stretch.done ? `stretched${w.stretch.min ? ' ' + w.stretch.min + ' min' : ''}` : 'no stretch logged'}</div></div><span class="badge done">Cardio</span></div>`;
  const secOnly = [...sec].filter(m => !prim.has(m));
  const figure = prim.size ? `<div class="bodyfig" style="margin-bottom:12px">${Body.svg({ primary: [...prim], secondary: secOnly, hl: t.color, label: 'Muscles trained' })}<div class="cap"><span>Front</span><span>Back</span></div></div>` : '';
  return `<h2 class="title">${esc(t.name)} — ${D.fmt(w.date)}</h2>${figure}
    <div class="summary">${rows || '<div class="empty">Nothing logged in this session.</div>'}</div>
    <p class="small muted" style="margin-top:12px">Saved automatically ${Store.cloud ? 'and synced' : 'on this phone'}.</p>`;
}

   CALENDAR · PROGRESS · BODY · GUIDE · SETTINGS · EVENTS · BOOT
   ============================================================ */
function renderCalendar() {
  const S = Store.state;
  if (!UI.cal) { const d = D.parse(UI.calSel); UI.cal = { y: d.getFullYear(), m: d.getMonth() }; }
  const { y, m } = UI.cal;
  const startPad = (new Date(y, m, 1).getDay() + 6) % 7; const days = new Date(y, m + 1, 0).getDate();
  const today = D.today();
  const byDate = {}; Store.allWorkouts().forEach(w => { (byDate[w.date] = byDate[w.date] || []).push(w); });
  let html = `<div class="calhead"><button class="icon-btn" data-act="cal-shift" data-n="-1" aria-label="Previous month">${ICON.chevL}</button><div class="m">${D.monthName(y, m)}</div><div class="row"><button class="btn sm ghost" data-act="cal-today">Today</button><button class="icon-btn" data-act="cal-shift" data-n="1" aria-label="Next month">${ICON.chevR}</button></div></div>`;
  html += `<div class="cal">` + ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<div class="wd">${d}</div>`).join('');
  for (let i = 0; i < startPad; i++) html += `<div class="day pad"></div>`;
  for (let d = 1; d <= days; d++) {
    const k = `${y}-${D.pad(m + 1)}-${D.pad(d)}`; const ws = byDate[k] || [];
    html += `<button class="day${k === today ? ' today' : ''}${k === UI.calSel ? ' sel' : ''}${k > today ? ' future' : ''}" data-act="cal-sel" data-date="${k}" aria-label="${D.fmt(k)}${ws.length ? ', ' + ws.map(w => DAY_TYPES[w.type].name).join(' and ') : ''}"><span class="d">${d}</span><span class="marks">${ws.map(w => `<span class="mk${w.demo ? ' demo' : ''}" data-type="${w.type}">${DAY_TYPES[w.type].letter}</span>`).join('')}</span></button>`;
  }
  html += `</div><div class="legend">` + Object.entries(DAY_TYPES).map(([k, t]) => `<span data-type="${k}"><i></i>${t.name} (${t.letter})</span>`).join('') + `</div>`;
  const monthWs = Store.allWorkouts().filter(w => w.date.startsWith(`${y}-${D.pad(m + 1)}`));
  const lifts = monthWs.filter(w => DAY_TYPES[w.type].lifting).length;
  const cMin = monthWs.reduce((a, w) => a + (+(w.cardio && w.cardio.min) || 0), 0);
  html += `<div class="stat-tiles" style="margin-top:12px"><div class="tile"><div class="v">${monthWs.length}</div><div class="l">Sessions</div></div><div class="tile"><div class="v">${lifts}</div><div class="l">Lift days</div></div><div class="tile"><div class="v">${cMin}</div><div class="l">Cardio min</div></div></div>`;
  const sel = UI.calSel; const ws = byDate[sel] || [];
  html += `<div class="daydetail"><div class="section"><h2>${D.fmt(sel, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>${sel <= today ? `<button class="btn sm ghost" data-act="log-on-date" data-date="${sel}">${ICON.plus} Log a session</button>` : ''}</div>`;
  if (!ws.length) html += `<div class="empty">Nothing logged on this day.</div>`;
  ws.forEach(w => { html += dayWorkoutCard(w); });
  const bw = S.bodyweight[sel];
  if (bw) html += `<p class="small muted" style="margin-top:10px">Weigh-in: <b style="color:var(--ink-2)">${fmtW(bw.kg)} kg</b>${bw.demo ? ' (sample)' : ''}</p>`;
  return html + `</div>`;
}

function dayWorkoutCard(w) {
  const S = Store.state; const t = DAY_TYPES[w.type]; const u = S.settings.units;
  let body = '';
  if (t.lifting) {
    const lines = (w.entries || []).map(en => {
      const ex = Store.exercise(en.ex); if (!ex) return '';
      const st = Engine.sessionStats(ex, en.sets, S.settings); if (!st) return '';
      const ev = Engine.evaluate(ex, Store.history(ex.id, { includeOpen: true }).filter(h => h.date < w.date || h.workoutId === w.id), S.settings);
      const si = Engine.scoreInfo(ex, u);
      return `<div class="exline"><div><div>${esc(ex.name)} <span class="badge ${ev.status}">${STATUS_LABEL[ev.status]}</span></div><div class="reps">${st.sets.map(s => `${s.r}${s.rir === 0 ? '<span class="fail">†</span>' : ''}`).join(' · ')}${Engine.repUnit(ex)} · ${si.short} ${si.fmt(st.score)}</div></div><div class="w">${Engine.loadText(ex, st.w, u)}</div></div>`;
    }).join('');
    body = lines ? `<div class="exlist">${lines}</div>` : `<p class="small muted" style="margin-top:8px">No sets logged.</p>`;
  }
  if (w.cardio && +w.cardio.min > 0) body += `<div class="cardioline"><span>${ICON.cardio}</span><div><b>${esc(w.cardio.kind || 'Cardio')}</b> · ${w.cardio.min} min${w.cardio.rpe ? ` · RPE ${w.cardio.rpe}` : ''}${w.stretch && w.stretch.done ? ` · stretched${w.stretch.min ? ' ' + w.stretch.min + ' min' : ''}` : ''}</div></div>`;
  const r = w.readiness || {};
  const feel = (r.energy || r.sleep || r.soreness) ? `Energy ${r.energy || '–'} · Sleep ${r.sleep || '–'} · Soreness ${r.soreness || '–'}${w.sessionRPE ? ` · Session RPE ${w.sessionRPE}` : ''}` : (w.sessionRPE ? `Session RPE ${w.sessionRPE}` : '');
  return `<div class="card" style="margin-top:10px"><div class="row between"><div class="row wrap">${typeChip(w.type)}${w.demo ? '<span class="badge demo">Sample</span>' : ''}<span class="badge ${w.status === 'done' ? 'done' : 'open'}">${w.status === 'done' ? 'Finished' : 'In progress'}</span></div><div class="row"><button class="btn sm" data-act="open" data-id="${w.id}">Open</button><button class="icon-btn" data-act="delete-id" data-id="${w.id}" aria-label="Delete this session">${ICON.trash}</button></div></div>
    ${body}${feel ? `<p class="small muted" style="margin-top:8px">${feel}</p>` : ''}${w.note ? `<p class="small" style="margin-top:6px;color:var(--ink-2)">“${esc(w.note)}”</p>` : ''}</div>`;
}

function progressExercise(id) {
  const S = Store.state; const ex = Store.exercise(id); if (!ex) return '';
  const u = S.settings.units; const m = Engine.modeOf(ex); const si = Engine.scoreInfo(ex, u);
  const hist = Store.history(id).map(h => ({ ...h, st: Engine.sessionStats(ex, h.sets, S.settings) })).filter(h => h.st);

  let html = `<div class="card" style="margin-top:6px"><div class="row between"><div><div class="display" style="font-size:22px">${esc(ex.name)}</div><div class="small muted">${muscleNames(ex.primary).join(' · ')}</div></div>${typeChip(ex.day)}</div>
    <div class="reco ${ev.status}" style="margin:12px 0 0"><span class="ic">${STATUS_ICON[ev.status]}</span><div class="grow"><div class="t">${esc(words.title)}</div><div class="d">${esc(words.detail)}</div></div></div></div>`;
  if (!hist.length) return html + `<div class="empty" style="margin-top:12px"><b>No sessions yet</b>Log it once and the charts appear here.</div>`;
  html += `<div class="stat-tiles" style="margin-top:12px">

  const x = h => D.fmtShort(h.date);
  let line, bars, lineTitle, barTitle, tipsA, tipsB;
  if (m === 'assisted') {
    line = hist.map(h => ({ x: x(h), y: h.st.reps })); lineTitle = ['Total reps', 'all sets added up'];
    bars = hist.map(h => ({ x: x(h), y: h.st.w, label: `${h.st.last.r}`, color: h.st.hit ? 'var(--ok)' : h.st.under ? 'var(--bad)' : col })); barTitle = ['Assistance', 'lower = stronger · label = final-set reps'];
    tipsA = hist.map(h => `<b>${h.st.reps} reps</b><br><small>${D.fmt(h.date)} · ${h.st.repsText}</small>`); tipsB = hist.map(h => `<b>${fmtW(h.st.w)} ${u} assist</b><br><small>${D.fmt(h.date)}</small>`);
  } else if (m === 'load') {
    line = hist.map(h => ({ x: x(h), y: Math.round(h.st.score * 10) / 10 })); lineTitle = [si.label, si.hint];
    bars = hist.map(h => ({ x: x(h), y: h.st.w, label: `${h.st.last.r}`, color: h.st.hit ? 'var(--ok)' : h.st.under ? 'var(--bad)' : col })); barTitle = ['Working weight', 'label = final-set reps · green = hit target'];
    tipsA = hist.map(h => `<b>${Math.round(h.st.score)} ${u}</b> e1RM<br><small>${D.fmt(h.date)} · ${fmtW(h.st.w)} × ${h.st.repsText}</small>`); tipsB = hist.map(h => `<b>${fmtW(h.st.w)} ${u}</b><br><small>${D.fmt(h.date)} · ${h.st.repsText}</small>`);
  } else {
    const un = m === 'timed' ? 's' : 'reps';
    line = hist.map(h => ({ x: x(h), y: h.st.best })); lineTitle = [si.label, si.hint];
    bars = hist.map(h => ({ x: x(h), y: h.st.reps, label: !ex.levels && h.st.w > 0 ? `+${fmtW(h.st.w)}` : '', color: h.st.hit ? 'var(--ok)' : h.st.under ? 'var(--bad)' : col })); barTitle = [m === 'timed' ? 'Total time held' : 'Total reps', m === 'timed' ? 'all sets added up, seconds' : ex.levels ? 'all sets added up' : 'all sets · label = added kg'];
    tipsA = hist.map(h => `<b>${h.st.best} ${un}</b><br><small>${D.fmt(h.date)} · ${Engine.loadText(ex, h.st.w, u)}</small>`); tipsB = hist.map(h => `<b>${h.st.reps} ${un}</b> in total<br><small>${D.fmt(h.date)} · ${h.st.repsText}</small>`);
  }
  html += `<div class="section"><h2>${lineTitle[0]}</h2><span class="hint">${lineTitle[1]}</span></div>` + Chart.line(line, { color: col, fmt: v => Math.round(v) });
  html += `<div class="section"><h2>${barTitle[0]}</h2><span class="hint">${barTitle[1]}</span></div>` + Chart.bars(bars, { fmt: v => Math.round(v) });
  html += `<div class="section"><h2>History</h2></div><div class="history">` + hist.slice().reverse().map(h => {
    const e2 = Engine.evaluate(ex, Store.history(id).filter(q => q.date < h.date || q.workoutId === h.workoutId), S.settings);
    return `<div class="hrow"><span class="d">${D.fmtShort(h.date)}</span><span class="r">${h.st.sets.map(s => `${s.r}${s.rir === 0 ? '<span class="fail">†</span>' : ''}`).join(' · ')}${Engine.repUnit(ex)} <span class="badge ${e2.status}">${STATUS_LABEL[e2.status]}</span></span><span class="w">${Engine.loadText(ex, h.st.w, u)}</span></div>`;
  }).join('') + `</div><p class="small muted" style="margin-top:8px">† last set taken all the way (0 in reserve).</p>`;
  UI._chartTips = [tipsA, tipsB];
  return html;
}

  html += `<div class="stat-tiles" style="margin-top:10px"><div class="tile"><div class="v">${rows.filter(r => r.sets > 0).length}<small>/ ${rows.length}</small></div><div class="l">Muscles trained</div></div><div class="tile ok"><div class="v">${rows.filter(r => r.zone === 'grow').length}</div><div class="l">In growth zone</div></div><div class="tile"><div class="v">${fmtW(vol.glutes.sets)}</div><div class="l">Glute sets</div></div></div>`;
  html += `<p class="small muted" style="margin:10px 0 6px">Weekly sets per muscle (an exercise's helper muscles count half a set). About ${goal}+ sets a week is linked with the most growth; 4+ is the minimum that works. Tap a muscle to see which exercises hit it.</p>`;
  html += `<div class="musclelist">` + rows.map(r => {
    const from = Object.entries(r.from).sort((a, b) => b[1] - a[1]).map(([n, c]) => `${n} ${c % 1 ? c.toFixed(1) : c}`).join(' · ');
    return `<button class="mrow zone-${r.zone}${UI.bodySel === r.m ? ' sel' : ''}" data-act="muscle-sel" data-m="${r.m}"><div><div class="n">${MUSCLES[r.m].name}</div><div class="s">${from || 'Nothing this week'}</div><div class="mbar"><i style="width:${Math.min(100, (r.sets / goal) * 100)}%"></i></div></div><div class="v">${r.sets % 1 ? r.sets.toFixed(1) : r.sets}<small>${zoneWord[r.zone]}</small></div></button>`;

/* ---------------- guide ---------------- */
function refLink(k) { const r = REFS.find(x => x.k === k); if (!r) return ''; const url = r.doi ? `https://doi.org/${r.doi}` : r.url; const n = REFS.indexOf(r) + 1; return url ? `<a href="${url}" target="_blank" rel="noopener" title="${esc(r.cite)}">[${n}]</a>` : `<span title="${esc(r.cite)}">[${n}]</span>`; }
function renderGuide() {
  const S = Store.state; const t = S.settings;
  const R = k => `<span class="ref">${k.split(',').map(x => refLink(x.trim())).join(' ')}</span>`;
  const kg = Store.latestWeight(); const protein = kg ? Math.round(kg * 1.6 / 5) * 5 : null;
  return `<div class="guide">
  <h2 class="title">Why the app says what it says</h2>
  <p class="lede">Built around your week — glutes, back &amp; arms, legs, each finished with cardio and a stretch — and your goal: lose fat, keep and build muscle, get stronger. Every rule below comes from published research, and every claim links to its source.</p>

  <article><h3>When do I go up in weight?</h3>
  <p>When your performance says so, not on a fixed schedule. The two best-supported tools are <strong>double progression</strong> (add reps inside a range first, then add weight) and the <strong>2-for-2 rule</strong>: when you beat your rep target by two or more on the last set in two sessions in a row, the weight goes up. The ACSM recommends jumps of <strong>2–10%</strong> at that point. ${R('ACSM09,NSCA16')}</p>
  <p>Adding reps at the same weight builds muscle about as well as adding weight, so both halves count. ${R('PLOT22')}</p>
  <p><strong>Light machines, big jumps.</strong> Many machines only go up 5 kg at a time. On a 20 kg stack that is a 25% jump, well past the 2–10% guideline. When the smallest step is more than ~12% of your weight, the app asks for <strong>3 extra reps</strong> on the final set before telling you to move up, so the new weight still lands inside your rep range. If your gym has 1–2.5 kg add-on plates, set that as the exercise's smallest jump.</p>
  <div class="rule"><span class="k increase">Level up</span><p>Two sessions in a row at the same weight where every working set reached <strong>${t.targetReps}</strong> and the final set reached <strong>${t.topReps}+</strong>. Jump = the exercise's smallest step.</p></div>
  <div class="rule"><span class="k almost">1 of 2</span><p>You hit the targets once. Do it again next session and the app tells you to move up.</p></div>
  <div class="rule"><span class="k hold">Hold</span><p>Working sets on target, final set under the top: you're in the productive zone. Same weight, chase reps.</p></div>
  <div class="rule"><span class="k newload">New load</span><p>First session after a jump. Reps usually dip; rebuild from there.</p></div>
  <div class="rule"><span class="k caution">Caution</span><p>A set fell under the floor of <strong>${t.floorReps}</strong>. Keep the weight, focus on reps.</p></div>
  <div class="rule"><span class="k reduce">Ease off</span><p>Two sessions in a row under the floor. Step back a little and climb again. That beats grinding.</p></div>
  <div class="rule"><span class="k plateau">Plateau</span><p>Four or more sessions at one weight with no extra reps. Take a lighter week (about half the sets), add a set, or look at sleep and food. A one-week deload did not cost muscle or strength in a controlled study. ${R('COLE24')}</p></div>
  </article>

  <article><h3>Push-ups, pull-ups and planks</h3>
  <p>Same 2-for-2 idea, a different way to go up. ${R('PLOT22')}</p>
  <ul>
    <li><strong>Push-ups and knee crunches:</strong> build reps first, then move up a <em>version</em> (for push-ups: incline → knees → full → slow lowering → feet raised). Pick the version with − / + on the card; the app treats each step like a weight increase.</li>
    <li><strong>Split squats and step-ups:</strong> build reps with bodyweight, then hold dumbbells, logged in the <em>+kg</em> column.</li>
    <li><strong>Pull-ups on the assisted machine:</strong> the number is how much <em>help</em> you get, so going <strong>down</strong> is progress. The app tells you when to take ${fmtW(Store.exercise('pull-up')?.step || 5)} kg of assistance off, and cheers when you can go without.</li>
    <li><strong>Plank:</strong> tap ▶ Time on a set and Stop when you drop. Once you hold 60 s on the last set two sessions in a row, the app moves you to the next version (knees → full → shoulder taps → plate).</li>
  </ul></article>

  <article><h3>Logging how it felt: RIR</h3>
  <p>After each set you tap <strong>reps in reserve</strong> (RIR): how many more you could have done. It's a validated effort scale, and it lets the app read effort as well as the numbers. ${R('ZOUR16,HELM16')}</p>
  <div class="tablewrap"><table class="rpe"><tr><th>RIR</th><th>What it feels like</th></tr>
  <tr><td>0</td><td>Nothing left: your last set</td></tr>
  <tr><td>1</td><td>One more rep was possible</td></tr>
  <tr><td>2</td><td>Two more: the "good burn" on sets 1–2</td></tr>
  <tr><td>3</td><td>Three more, still challenging</td></tr>
  <tr><td>4+</td><td>Light: the weight is due to go up</td></tr></table></div>
  <p>People judge this best close to failure, so one all-out set per exercise keeps your sense of effort accurate. ${R('HALP22')} Low energy, poor sleep or heavy soreness are good reasons to repeat a weight rather than jump, and the "How do you feel?" dots feed into the advice. ${R('HELM16')}</p>
  </article>

  <article><h3>Why the last set goes all out</h3>
  <p>Muscle growth improves modestly the closer sets get to failure. Taking <em>every</em> set to failure mainly adds fatigue, so one all-out set per exercise with the others at 1–3 in reserve is a sensible split. ${R('ROBI24,REFA23,GRGI22')} The burn is a side effect; hard, controlled reps against real resistance are what drive change. ${R('SCHO10')}</p>
  </article>

  <article><h3>Rep ranges</h3>
  <p>Muscle grows about equally anywhere from ~6 to 30 reps when sets are hard; heavier loads help strength a little more. 8–12 is the default here; abduction, adduction, kickbacks and ab work use 12–15 or 15–20, where they feel best. ${R('SCHO17L,SCHO21')}</p>
  </article>

  <article><h3>Building your glutes</h3>
  <p>Hip thrusts and squat-pattern moves such as split squats grew the glutes by similar amounts in a 2023 trial, so your glute day's mix of both is well founded. ${R('PLOT23')} Hitting a muscle at least twice a week and doing about <strong>10+ hard sets a week</strong> are linked with more growth. ${R('SCHO16F,SCHO17V,IVER21')} Your plan works glutes on glute day <em>and</em> leg day (hip thrust, leg press), and the Body tab counts the sets for you.</p>
  </article>

  <article><h3>Losing fat without losing muscle</h3>
  <p>Strength keeps climbing while you eat a little less. In a meta-analysis, strength gains were about the same in a calorie deficit, though muscle gains shrank as the deficit grew; around 500 kcal a day was enough to stall them. ${R('MURP22')} Slower loss also kept more muscle and strength: ~0.7% of body weight a week beat ~1.4%. ${R('GART11')} ${kg ? `For you that's roughly <strong>${(kg * 0.005).toFixed(1)}–${(kg * 0.01).toFixed(1)} kg a week</strong>.` : 'Log a weigh-in and your personal range appears here.'} The Weigh-ins view shows your 7-day average against that range.</p>
  <p><strong>Protein:</strong> gains from lifting level off around <strong>1.6 g per kg</strong> of body weight a day (the upper estimate is 2.2 g) ${protein ? `— about <strong>${protein} g a day</strong> for you` : '— your number appears here once you log a weigh-in'}. ${R('MORT18')}</p>
  </article>

  <article><h3>Cardio after lifting</h3>
  <p>Doing cardio alongside strength training did not reduce muscle growth or maximal strength in an updated meta-analysis, so cardio after your session is fine. ${R('SCHU22')} The WHO recommends <strong>150–300 minutes</strong> of moderate activity a week, which is what the cardio tile tracks. ${R('WHO20')} The cardio effort score (RPE × minutes) is a standard way to track training load. ${R('FOST01')} If you run, raise weekly distance gradually; jumps above ~30% were linked to more injuries. ${R('NIEL14')}</p>
  </article>

  <article><h3>Stretch after, not before</h3>
  <p>Long static stretches (over ~60 s per muscle) right before lifting can slightly reduce strength; short holds and a dynamic warm-up don't. Stretching at the end, as you already do, gets the flexibility benefit without the cost. ${R('BEHM16')}</p>
  </article>

  <article><h3>Training as a woman</h3>
  <p>Women gain muscle at the same relative rate as men on the same program, and gain <em>more</em> relative upper-body strength, so these rules apply to you as written. ${R('ROBE20')} Current reviews find no consistent effect of cycle phase on strength or on how well you adapt; any effect is small and differs person to person. ${R('COLE23,MCNU20')} Go by how you feel on the day, which is exactly what the readiness dots are for.</p>
  </article>

  <article><h3>Rest between sets</h3>
  <p>Resting longer than a minute gave a small edge for muscle growth, and 3 minutes beat 1 minute for strength and size in trained lifters. ${R('SING24,SCHO16R')} The timer defaults to <strong>${Math.round(t.restCompound / 60 * 10) / 10} min</strong> for big moves and <strong>${t.restIsolation} s</strong> for small ones; change them in Settings.</p>
  </article>

  <article><h3>How progress is measured</h3>
  <p>Machine lifts use an estimated one-rep max (Epley: weight × (1 + reps/30)), which rises whether you add weight or reps. ${R('EPLE85')} Bodyweight moves use your best set, planks your longest hold, and assisted pull-ups the assistance, where lower is stronger.</p>
  </article>

  <article><h3>References</h3>
  <ol class="refs">` + REFS.map((r, i) => `<li><span class="k">${i + 1}</span><span>${esc(r.cite)}${r.doi ? ` <a href="https://doi.org/${r.doi}" target="_blank" rel="noopener">doi:${r.doi}</a>` : r.url ? ` <a href="${r.url}" target="_blank" rel="noopener">link</a>` : ''}</span></li>`).join('') + `</ol>
  <p class="small muted" style="margin-top:12px">General training and nutrition guidance from published research, not medical advice. If something hurts, or you have a health condition, check with a professional.</p>
  </article></div>`;
}

/* quiet = re-render in place (a tap on a chip or dot) without the page-enter animation or a scroll jump */
function render(quiet) {
  const view = $('#view'); const y = window.scrollY;
  const fns = { train: renderTrain, calendar: renderCalendar, progress: renderProgress, body: renderBodyTab, guide: renderGuide };
  UI._chartTips = null;
  view.innerHTML = `<div class="view${quiet ? ' still' : ''}">${(fns[UI.tab] || renderTrain)()}</div>`;
  $$('.tab').forEach(b => { b.classList.toggle('active', b.dataset.tab === UI.tab); b.setAttribute('aria-current', b.dataset.tab === UI.tab ? 'page' : 'false'); });
  if (UI._chartTips) $$('.chart', view).forEach((ch, i) => Chart.bind(ch, UI._chartTips[i] || []));
  Store.state.ui.tab = UI.tab;
  if (quiet) window.scrollTo({ top: y });
}
function rerenderCard(entryIdx) {
  const w = currentWorkout(); if (!w) return render(true);
  const card = $(`.ex[data-entry="${entryIdx}"]`); if (!card) return render(true);
  const tmp = document.createElement('div'); tmp.innerHTML = renderExerciseCard(w, w.entries[entryIdx], entryIdx);
  const fresh = tmp.firstElementChild; fresh.style.animation = 'none';
  card.replaceWith(fresh);
}
function updateLive(entryIdx) {
  const w = currentWorkout(); if (!w) return;
  const en = w.entries[entryIdx]; const ex = Store.exercise(en.ex);
  const el = $(`.ex[data-entry="${entryIdx}"] [data-live]`); if (el) el.innerHTML = liveLine(ex, en, Store.state.settings);
}
function setSaveState(info) {
  const el = $('#saveState'); const txt = $('#saveText');
  el.className = 'save-state';
  if (info.pending) { el.classList.add('saving'); txt.textContent = 'Saving…'; return; }
  if (info.ok === false) { el.classList.add('error'); txt.textContent = 'Not saved'; return; }
  if (info.warn) { el.classList.add('saved'); txt.textContent = info.warn; return; }
  el.classList.add('saved'); txt.textContent = info.cloud ? 'Synced' : 'Saved';
  if (IN_CLAUDE_FRAME && !info.cloud) { el.className = 'save-state temp'; txt.textContent = 'Not kept'; }
}

async function swapEntry(w, i, alt) {
  const en = w.entries[i]; const ex = Store.exercise(en.ex);
  if (en.sets.some(s => +s.r > 0) && !await confirmDialog({ title: `Swap for ${alt.name}?`, body: `The sets you already logged for ${ex.name} will be removed.`, confirm: 'Swap', danger: true })) return;
  w.entries[i] = Store.newEntry(alt, w.id, w.date); Store.save({ workouts: [w.id] }); rerenderCard(i); toast(`Swapped to ${alt.name}`);
}
async function deleteSession(id, { fromTrain = false } = {}) {
  const w = Store.state.workouts[id]; if (!w) return;
  const ok = await confirmDialog({ title: 'Delete this session?', body: `${DAY_TYPES[w.type].name} — ${D.fmt(w.date, { weekday: 'long', day: 'numeric', month: 'long' })}. Everything logged in it is removed.`, confirm: 'Delete', danger: true });
  if (!ok) return;
  const snap = JSON.parse(JSON.stringify(w));
  Store.deleteWorkout(id);
  if (UI.openWorkout === id) { UI.openWorkout = null; Timer.stop(); }
  render(true);
  toast('Session deleted', 6500, { label: 'Undo', fn: () => { Store.restoreWorkout(snap); if (fromTrain) UI.openWorkout = snap.id; render(true); toast('Session restored'); } });
}
function openWorkout(id) { const w = Store.state.workouts[id]; if (!w) return; UI.openWorkout = id; UI.date = w.date; UI.tab = 'train'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function currentWorkout() { return UI.openWorkout ? Store.state.workouts[UI.openWorkout] : null; }
function num(v) { if (v === '' || v == null) return ''; const n = Number(v); return isNaN(n) ? '' : n; }
function restFor(ex) { return ex.compound ? Store.state.settings.restCompound : Store.state.settings.restIsolation; }

function bindEvents() {
  const view = $('#view');
  $$('.tab').forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); }));
  $('#btnSettings').addEventListener('click', () => openSheet(settingsHTML(), 'Settings'));
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#backdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  $('#timerHost').addEventListener('click', e => { const b = e.target.closest('[data-timer]'); if (!b) return; if (b.dataset.timer === 'add') Timer.add(30); else Timer.stop(); });

  view.addEventListener('click', async e => {
    const S = Store.state;
    const act = e.target.closest('[data-act]');
    const w = currentWorkout();
    // set steppers
    const st = e.target.closest('[data-step]');
    if (st) {
      const setEl = st.closest('.set'), card = st.closest('.ex'); if (!w) return;
      const en = w.entries[+card.dataset.entry]; const ex = Store.exercise(en.ex); const s = en.sets[+setEl.dataset.s];
      const f = st.dataset.step, n = +st.dataset.n; const input = $(`input[data-f="${f}"]`, setEl);
      if (f === 'w') { const cur = s.w === '' || s.w == null ? (+input.placeholder || ex.weight || 0) : +s.w; s.w = Math.max(0, Math.round((cur + n * (ex.step || 1)) * 100) / 100); input.value = s.w; }
      else { const inc = Engine.modeOf(ex) === 'timed' ? 5 : 1; const cur = s.r === '' || s.r == null ? (+input.placeholder || 10) - (n > 0 ? inc : -inc) : +s.r; s.r = Math.max(0, cur + n * inc); input.value = s.r; }
      Store.save({ workouts: [w.id] }); updateLive(+card.dataset.entry); return;
    }
    // version ladder (push-ups, plank, crunches)
    const lv = e.target.closest('[data-lvl]');
    if (lv && w) {
      const card = lv.closest('.ex'); const idx = +card.dataset.entry; const en = w.entries[idx]; const ex = Store.exercise(en.ex);
      const cur = +(en.sets[0] && en.sets[0].w) || 0; const next = Math.max(0, Math.min(ex.levels.length - 1, cur + +lv.dataset.lvl));
      en.sets.forEach(s => { s.w = next; }); Store.save({ workouts: [w.id] }); rerenderCard(idx); return;
    }
    // cardio minutes stepper
    const cs = e.target.closest('[data-cstep]');
    if (cs && w) { w.cardio = w.cardio || {}; w.cardio.min = Math.max(0, (+w.cardio.min || 0) + +cs.dataset.cstep); $('#cMin').value = w.cardio.min; Store.save({ workouts: [w.id] }); refreshCardioWeek(); return; }
    // cardio kind chips
    const ck = e.target.closest('[data-ck]');
    if (ck && w) { w.cardio = w.cardio || {}; w.cardio.kind = w.cardio.kind === ck.dataset.ck ? '' : ck.dataset.ck; Store.save({ workouts: [w.id] }); $$('[data-ck]').forEach(b => b.classList.toggle('on', b.dataset.ck === w.cardio.kind)); return; }
    // weigh-in stepper
    const bs = e.target.closest('[data-bwstep]');
    if (bs) { const inp = $('#bwInput'); const cur = inp.value === '' ? (+inp.placeholder || 70) : +inp.value; inp.value = (Math.round((cur + 0.1 * +bs.dataset.bwstep) * 10) / 10).toFixed(1); return; }
    // readiness / session rpe / cardio rpe dots
    const dot = e.target.closest('.dots button');
    if (dot && w) {
      const box = dot.closest('.dots'); const v = +dot.dataset.v;
      if (box.dataset.read) { w.readiness = w.readiness || {}; w.readiness[box.dataset.read] = w.readiness[box.dataset.read] === v ? 0 : v; }
      else if (box.dataset.srpe) w.sessionRPE = w.sessionRPE === v ? null : v;
      else if (box.dataset.crpe) { w.cardio = w.cardio || {}; w.cardio.rpe = w.cardio.rpe === v ? null : v; }
      Store.save({ workouts: [w.id] }); return render(true);
    }
    if (!act) return;
    switch (act.dataset.act) {
      case 'date-shift': UI.date = D.add(UI.date, +act.dataset.n); UI.openWorkout = null; return render(true);
      case 'start': { const nw = Store.createWorkout(act.dataset.typ, UI.date); UI.openWorkout = nw.id; render(); window.scrollTo({ top: 0 }); return; }
      case 'open': return openWorkout(act.dataset.id);
      case 'close-workout': UI.openWorkout = null; return render();
      case 'log-on-date': UI.date = act.dataset.date; UI.openWorkout = null; UI.tab = 'train'; return render();
      case 'bw-save': {
        const v = parseFloat($('#bwInput').value);
        if (!(v >= 30 && v <= 250)) { toast('Type your weight in kg first'); $('#bwInput').focus(); return; }
        Store.setWeight(UI.date, v); render(true); toast(`${fmtW(Math.round(v * 10) / 10)} kg saved`); return;
      }
      case 'bw-del': { const d = act.dataset.date; const was = Store.removeWeight(d); render(true); toast('Weigh-in removed', 5000, { label: 'Undo', fn: () => { S.bodyweight[d] = was; Store.save({ meta: true }); render(true); } }); return; }
      case 'stretch': { if (!w) return; w.stretch = w.stretch || {}; w.stretch.done = !w.stretch.done; if (w.stretch.done && !w.stretch.min) w.stretch.min = 10; Store.save({ workouts: [w.id] }); return render(true); }
      case 'hold': {
        const setEl = act.closest('.set'), card = act.closest('.ex'); const idx = +card.dataset.entry; const en = w.entries[idx]; const ex = Store.exercise(en.ex); const s = en.sets[+setEl.dataset.s];
        const isLast = +setEl.dataset.s === en.sets.length - 1 && en.sets.length > 1; const tg = Engine.exTargets(ex, S.settings);
        Timer.hold(isLast ? tg.top : tg.target, secs => { if (secs > 0) { s.r = secs; s.done = true; Store.save({ workouts: [w.id] }); rerenderCard(idx); Timer.start(restFor(ex)); } });
        return;
      }
      case 'set-done': {
        const setEl = act.closest('.set'), card = act.closest('.ex'); const en = w.entries[+card.dataset.entry]; const ex = Store.exercise(en.ex); const s = en.sets[+setEl.dataset.s];
        s.done = !s.done;
        if (s.done) {
          const rIn = $('input[data-f="r"]', setEl), wIn = $('input[data-f="w"]', setEl);
          if (s.r === '' || s.r == null) { s.r = +rIn.placeholder || 0; rIn.value = s.r; }
          if (wIn && (s.w === '' || s.w == null)) { s.w = +wIn.placeholder || 0; if (s.w) wIn.value = s.w; }
          Timer.start(restFor(ex));
        }
        act.classList.toggle('on', s.done); act.setAttribute('aria-pressed', s.done); setEl.classList.toggle('isdone', s.done);
        Store.save({ workouts: [w.id] }); updateLive(+card.dataset.entry); return;
      }
      case 'rir': { const setEl = act.closest('.setrir'), card = act.closest('.ex'); const s = w.entries[+card.dataset.entry].sets[+setEl.dataset.s]; s.rir = +act.dataset.v; $$('button', setEl).forEach(b => b.classList.toggle('on', +b.dataset.v === s.rir)); Store.save({ workouts: [w.id] }); updateLive(+card.dataset.entry); return; }
      case 'add-set': { const card = act.closest('.ex'); const en = w.entries[+card.dataset.entry]; const last = en.sets[en.sets.length - 1]; en.sets.push({ w: last ? last.w : '', r: '', rir: 0, done: false }); if (last && last.rir === 0) last.rir = 2; Store.save({ workouts: [w.id] }); return rerenderCard(+card.dataset.entry); }
      case 'remove-set': { const card = act.closest('.ex'); const en = w.entries[+card.dataset.entry]; if (en.sets.length > 1) en.sets.pop(); Store.save({ workouts: [w.id] }); return rerenderCard(+card.dataset.entry); }
      case 'toggle-note': { const card = act.closest('.ex'); const en = w.entries[+card.dataset.entry]; en._noteOpen = !en._noteOpen; const box = $('.exnote', card); box.classList.toggle('hidden', !(en._noteOpen || en.note)); if (!box.classList.contains('hidden')) $('input', box).focus(); return; }
      case 'swap': {
        const i = +act.dataset.e; const ex = Store.exercise(w.entries[i].ex);
        const alts = (ex.alts || []).map(a => Store.exercise(a)).filter(Boolean); if (!alts.length) return;
        if (alts.length === 1) return swapEntry(w, i, alts[0]);
        openSheet(`<h2 class="title">Swap ${esc(ex.name)} for…</h2><div class="exsettings">${alts.map(a => `<button class="exs" data-act="swap-to" data-e="${i}" data-ex="${a.id}"><div><div class="n">${esc(a.name)}</div></div>${ICON.swap}</button>`).join('')}</div>`, 'Swap exercise'); return;
      }
      case 'add-entry-main': { const ex = Store.exercise(act.dataset.ex); if (!ex) return; w.entries.push(Store.newEntry(ex, w.id, w.date)); Store.save({ workouts: [w.id] }); render(true); const card = $(`.ex[data-entry="${w.entries.length - 1}"]`); if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      case 'ex-menu': { const i = +act.dataset.e; const ex = Store.exercise(w.entries[i].ex); const alts = (ex.alts || []).map(a => Store.exercise(a)).filter(Boolean); openSheet(`<h2 class="title">${esc(ex.name)}</h2><div class="stack"><button class="btn block" data-act="show-muscles" data-ex="${ex.id}">Show muscles worked</button>${alts.map(a => `<button class="btn block" data-act="swap-to" data-e="${i}" data-ex="${a.id}">${ICON.swap} Swap for ${esc(a.name)}</button>`).join('')}<button class="btn block" data-act="ex-edit" data-ex="${ex.id}">Edit exercise (weight, steps, targets)</button><button class="btn block" data-act="move-entry" data-e="${i}" data-n="-1" ${i === 0 ? 'disabled' : ''}>Move up</button><button class="btn block" data-act="move-entry" data-e="${i}" data-n="1" ${i === w.entries.length - 1 ? 'disabled' : ''}>Move down</button><button class="btn block danger" data-act="remove-entry" data-e="${i}">Remove from this session</button></div>`, ex.name); return; }
      case 'show-muscles': return showMuscles(act.dataset.ex);
      case 'add-exercise': { const have = new Set(w.entries.map(e => e.ex)); const list = S.exercises.filter(e => !have.has(e.id) && !e.hidden); openSheet(`<h2 class="title">Add an exercise</h2><div class="exsettings">${list.map(e => `<button class="exs" data-act="add-entry" data-ex="${e.id}"><div><div class="n">${esc(e.name)}</div><div class="s">${DAY_TYPES[e.day].name}</div></div>${ICON.plus}</button>`).join('') || '<div class="empty">Every exercise is already in this session.</div>'}</div><button class="btn block ghost" style="margin-top:12px" data-act="ex-new">${ICON.plus} Create a new exercise</button>`, 'Add an exercise'); return; }
      case 'finish': {
        if (DAY_TYPES[w.type].lifting) {
          const logged = w.entries.filter(en => Engine.sessionStats(Store.exercise(en.ex), en.sets, S.settings));
          if (!logged.length && !await confirmDialog({ title: 'Nothing logged yet', body: 'No sets have been filled in for this session. Finish it anyway?', confirm: 'Finish' })) return;
          logged.forEach(en => { const ex = Store.exercise(en.ex); const st = Engine.sessionStats(ex, en.sets, S.settings); if (st && ex && (ex.levels || Engine.modeOf(ex) !== 'timed')) ex.weight = st.w; });
          w.entries.forEach(en => delete en._noteOpen);
        } else if (!(w.cardio && +w.cardio.min > 0) && !await confirmDialog({ title: 'No minutes logged', body: 'Finish this cardio session without any minutes?', confirm: 'Finish' })) return;
        w.status = 'done'; Timer.stop(); Store.save({ workouts: [w.id], meta: true }); render(); openSheet(summaryHTML(w), 'Session summary'); return;
      }
      case 'reopen': w.status = 'open'; Store.save({ workouts: [w.id] }); return render(true);
      case 'summary': return openSheet(summaryHTML(w), 'Session summary');
      case 'delete-workout': return deleteSession(w.id, { fromTrain: true });
      case 'delete-id': return deleteSession(act.dataset.id);
      case 'export-copy': { const txt = Store.exportJSON(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup copied — paste it into Notes', 3500)).catch(() => { openSheet(settingsHTML(), 'Settings'); const box = $('#importBox'); box.value = txt; box.select(); toast('Backup shown in Settings — select all and copy', 4000); }); return; }
      case 'load-demo': { const n = Store.loadDemo(); render(); toast(`${n} sample sessions added`); return; }
      case 'clear-demo': { const n = Store.clearDemo(); render(); toast(`${n} sample sessions removed`); return; }
      case 'cal-shift': { let { y, m } = UI.cal; m += +act.dataset.n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } UI.cal = { y, m }; return render(true); }
      case 'cal-today': { const d = D.parse(D.today()); UI.cal = { y: d.getFullYear(), m: d.getMonth() }; UI.calSel = D.today(); return render(true); }
      case 'cal-sel': UI.calSel = act.dataset.date; return render(true);
      case 'pick-ex': { const ex = Store.exercise(act.dataset.ex); UI.progressEx = act.dataset.ex; if (ex && !Store.dayPlan(UI.progressDay).some(p => p.ex.id === ex.id)) UI.progressDay = ex.day; return render(true); }
      case 'pick-day': UI.progressDay = act.dataset.day; UI.progressEx = null; return render(true);
      case 'body-week': UI.bodyWeek = Math.min(0, UI.bodyWeek + +act.dataset.n); return render(true);
      case 'muscle-sel': UI.bodySel = UI.bodySel === act.dataset.m ? null : act.dataset.m; return render(true);
    }
  });
  view.addEventListener('click', e => { const m = e.target.closest('.body.interactive .m'); if (m) { UI.bodySel = UI.bodySel === m.dataset.m ? null : m.dataset.m; render(true); const row = $(`.mrow[data-m="${UI.bodySel}"]`); if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });

  view.addEventListener('input', e => {
    const w = currentWorkout(); if (!w) return;
    const t = e.target;
    if (t.dataset.f && t.closest('.set')) {
      const setEl = t.closest('.set'), card = t.closest('.ex'); const s = w.entries[+card.dataset.entry].sets[+setEl.dataset.s];
      s[t.dataset.f] = num(t.value); Store.save({ workouts: [w.id] }); updateLive(+card.dataset.entry); return;
    }
    if (t.dataset.f === 'note') { w.entries[+t.closest('.ex').dataset.entry].note = t.value; Store.save({ workouts: [w.id] }); return; }
    if (t.dataset.wfield) { w[t.dataset.wfield] = t.value; Store.save({ workouts: [w.id] }); return; }
    if (t.dataset.cf) { w.cardio = w.cardio || {}; w.cardio[t.dataset.cf] = num(t.value); Store.save({ workouts: [w.id] }); refreshCardioWeek(); return; }
    if (t.dataset.sf) { w.stretch = w.stretch || {}; w.stretch.min = num(t.value); if (+t.value > 0 && !w.stretch.done) { w.stretch.done = true; const tg = $('[data-act="stretch"]'); if (tg) tg.classList.add('on'); } Store.save({ workouts: [w.id] }); return; }
  });
  view.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'bwInput') { e.preventDefault(); $('[data-act="bw-save"]').click(); } });
  view.addEventListener('change', e => { if (e.target.id === 'datePick') { UI.date = e.target.value || D.today(); UI.openWorkout = null; render(true); } });
  function refreshCardioWeek() { const el = $('[data-cweek]'); if (!el) return; const cw = Engine.cardioWeeks(Store.state.workouts, 1)[0]; el.innerHTML = `This week: <b style="color:var(--ink-2)">${cw.min} of ${Store.state.settings.cardioGoal} min</b> (WHO minimum for moderate cardio) · stretched ${cw.stretch}×.`; }

  /* ---- sheet events (settings, exercise editor, menus) ---- */
  const sheet = $('#sheetBody');
  sheet.addEventListener('click', async e => {
    const S = Store.state; const act = e.target.closest('[data-act]'); const w = currentWorkout();
    const tg = e.target.closest('[data-set-toggle]');
    if (tg) { S.settings[tg.dataset.setToggle] = !S.settings[tg.dataset.setToggle]; tg.classList.toggle('on'); Store.save({ meta: true }); return; }
    const eft = e.target.closest('[data-ef-toggle]'); if (eft) { eft.classList.toggle('on'); return; }
    const mp = e.target.closest('[data-mp]'); if (mp) { mp.className = mp.classList.contains('p') ? 's' : mp.classList.contains('s') ? '' : 'p'; refreshEditFig(); return; }
    const dp = e.target.closest('[data-dayp]'); if (dp) { dp.className = dp.classList.contains('p') ? 's' : dp.classList.contains('s') ? '' : 'p'; return; }
    const ab = e.target.closest('[data-alt]'); if (ab) { ab.classList.toggle('p'); return; }
    if (!act) return;
    switch (act.dataset.act) {
      case 'settings': return openSheet(settingsHTML(), 'Settings');
      case 'ex-edit': return openSheet(exerciseEditHTML(Store.exercise(act.dataset.ex)), 'Edit exercise');
      case 'ex-new': return openSheet(exerciseEditHTML(null), 'New exercise');
      case 'ex-save': {
        const box = $('.exedit', sheet); const id = box.dataset.exid; const get = k => $(`[data-ef="${k}"]`, box).value;
        const name = get('name').trim(); if (!name) { toast('Give the exercise a name'); return; }
        const ex = id ? Store.exercise(id) : { id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Store.uid().slice(-4), primary: [], secondary: [] };
        const on = k => $(`[data-ef-toggle="${k}"]`, box).classList.contains('on');
        Object.assign(ex, { name, mode: get('mode'), day: get('day'), weight: +get('weight') || 0, step: +get('step') >= 0 ? +get('step') : 2.5, target: +get('target') || S.settings.targetReps, top: +get('top') || S.settings.topReps, floor: +get('floor') || S.settings.floorReps,
          compound: on('compound'), perHand: on('perHand'), perSide: on('perSide'), alts: $$('[data-alts] .p', box).map(b => b.dataset.alt),
          primary: $$('[data-muscles] .p', box).map(b => b.dataset.mp), secondary: $$('[data-muscles] .s', box).map(b => b.dataset.mp) });
        if (!id) S.exercises.push(ex);
        const map = {}; $$('[data-dayp]', box).forEach(b => { if (b.classList.contains('p')) map[b.dataset.dayp] = 'on'; else if (b.classList.contains('s')) map[b.dataset.dayp] = 'opt'; });
        Store.setDays(ex.id, map);
        Store.save({ meta: true }); toast(id ? 'Exercise saved' : 'Exercise added'); openSheet(settingsHTML(), 'Settings'); render(true); return;
      }
      case 'ex-hide': { const ex = Store.exercise($('.exedit', sheet).dataset.exid); ex.hidden = !ex.hidden; Store.save({ meta: true }); openSheet(settingsHTML(), 'Settings'); render(true); return; }
      case 'ex-delete': { const ex = Store.exercise($('.exedit', sheet).dataset.exid); if (!await confirmDialog({ title: `Delete ${ex.name}?`, body: 'Sessions you already logged keep their data, but the exercise disappears from new workouts.', confirm: 'Delete', danger: true })) return; Store.removeExercise(ex.id); Store.save({ meta: true }); openSheet(settingsHTML(), 'Settings'); render(true); return; }
      case 'add-entry': { if (!w) return; w.entries.push(Store.newEntry(Store.exercise(act.dataset.ex), w.id, w.date)); Store.save({ workouts: [w.id] }); closeSheet(); render(true); return; }
      case 'swap-to': { if (!w) return; const alt = Store.exercise(act.dataset.ex); if (!alt) return; closeSheet(); swapEntry(w, +act.dataset.e, alt); return; }
      case 'remove-entry': { if (!w) return; const i = +act.dataset.e; const en = w.entries[i]; if (en.sets.some(s => +s.r > 0) && !await confirmDialog({ title: 'Remove this exercise?', body: 'The sets you logged for it in this session are removed too.', confirm: 'Remove', danger: true })) return; w.entries.splice(i, 1); Store.save({ workouts: [w.id] }); closeSheet(); render(true); return; }
      case 'move-entry': { if (!w) return; const i = +act.dataset.e, j = i + +act.dataset.n; if (j < 0 || j >= w.entries.length) return; [w.entries[i], w.entries[j]] = [w.entries[j], w.entries[i]]; Store.save({ workouts: [w.id] }); closeSheet(); render(true); return; }
      case 'show-muscles': return showMuscles(act.dataset.ex);
      case 'export-copy': { const txt = Store.exportJSON(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup copied — paste it into Notes')).catch(() => { $('#importBox').value = txt; $('#importBox').select(); toast('Backup shown below — select all and copy'); }); return; }
      case 'export-download': {
        const txt = Store.exportJSON(); const name = `crissy-lifts-backup-${D.today()}.json`;
        const viaCap = async () => { if (!(window.claude && window.claude.use)) return false; const dl = await window.claude.use('downloads'); if (!dl) return false; await dl.save({ filename: name, data: txt }); return true; };
        viaCap().then(ok => { if (ok) { toast('Backup saved'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded'); }).catch(() => toast('Could not save a file — use Copy backup instead'));
        return;
      }
      case 'import-merge': case 'import-replace': {
        const txt = $('#importBox').value.trim(); if (!txt) { toast('Paste a backup first'); return; }
        if (act.dataset.act === 'import-replace' && !await confirmDialog({ title: 'Replace everything?', body: 'Every session and weigh-in currently in the app is replaced by this backup.', confirm: 'Replace', danger: true })) return;
        try { const n = Store.importJSON(txt, act.dataset.act === 'import-replace' ? 'replace' : 'merge'); toast(`${n} sessions restored`); closeSheet(); render(); } catch (err) { toast(err.message || 'That backup could not be read'); }
        return;
      }
      case 'load-demo': { const n = Store.loadDemo(); openSheet(settingsHTML(), 'Settings'); render(true); toast(`${n} sample sessions added`); return; }
      case 'clear-demo': { const n = Store.clearDemo(); openSheet(settingsHTML(), 'Settings'); render(true); toast(`${n} sample sessions removed`); return; }
    }
  });
  sheet.addEventListener('change', e => {
    const t = e.target; if (!t.dataset.set) return;
    const S = Store.state; S.settings[t.dataset.set] = t.type === 'number' ? +t.value : (isNaN(+t.value) ? t.value : +t.value);
    Store.save({ meta: true }); render(true);
  });
  sheet.addEventListener('input', e => { if (e.target.dataset.ef === 'day') refreshEditFig(); });
  function refreshEditFig() { const box = $('.exedit', sheet); if (!box) return; $('#exEditFig').innerHTML = Body.svg({ primary: $$('[data-muscles] .p', box).map(b => b.dataset.mp), secondary: $$('[data-muscles] .s', box).map(b => b.dataset.mp), hl: DAY_TYPES[$('[data-ef="day"]', box).value].color }); }

  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.persistLocal(); });
  window.addEventListener('pagehide', () => Store.persistLocal());
}
function showMuscles(id) {
  const ex = Store.exercise(id); if (!ex) return;
  openSheet(`<h2 class="title">${esc(ex.name)}</h2><div class="bodyfig">${Body.svg({ primary: ex.primary, secondary: ex.secondary, hl: DAY_TYPES[ex.day].color, label: ex.name + ' muscles' })}<div class="cap"><span>Front</span><span>Back</span></div></div><div class="row wrap" style="margin-top:12px"><span class="chip" style="color:var(--ink)">Main: ${muscleNames(ex.primary).join(', ')}</span>${ex.secondary.length ? `<span class="chip">Helping: ${muscleNames(ex.secondary).join(', ')}</span>` : ''}</div>`, ex.name);
}

/* ---------------- boot ---------------- */
(function boot() {
  Store.load();
  UI.tab = Store.state.ui.tab || 'train';
  const openToday = Store.workoutsOn(D.today()).find(w => w.status === 'open');
  if (openToday) UI.openWorkout = openToday.id;
  Store.on('save', setSaveState);
  Store.on('remote', () => { const a = document.activeElement; if (a && a.closest && a.closest('#view') && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; render(true); });
  bindEvents();
  render();
  setSaveState({ ok: true, cloud: false });
  Store.initCloud().then(ok => { if (ok) { setSaveState({ ok: true, cloud: true }); render(true); } });
})();

</script>
<script>if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
