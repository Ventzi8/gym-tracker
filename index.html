<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crissy Lifts">
<meta name="description" content="Crissy's training log: glutes, back &amp; arms and legs days with cardio, weigh-ins and research-backed progression advice.">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<title>Crissy Lifts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#140d11; --bg-2:#1a1116; --surface:#22171d; --surface-2:#2b1d25; --surface-3:#37252f;
  --line:#33222b; --line-2:#48303c;
  --ink:#fcf0f5; --ink-2:#d7bccb; --ink-3:#9c7f8d; --ink-4:#624b57;
  --pink:#ff6fae; --pink-2:#ff9cc6; --pink-deep:#d8428a; --label:#c98aa8;
  --glutes:#ff6fae; --upper:#c3a1ff; --legs:#ffab8f; --full:#ffd27a; --cardio:#6fd8cf;
  --ok:#57d6a0; --warn:#ffc36b; --bad:#ff5f6d; --hold:#b8a3b1; --info:#a9b8ff;
  --body:#271b22; --muscle:#35262f; --muscle-line:#4a3440; --hair:#46303b;
  --radius:18px;
  --font-display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --tabbar-h:62px;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
body{
  margin:0;color:var(--ink);font:15px/1.45 var(--font-body);
  background:radial-gradient(110% 420px at 50% -120px,rgba(255,111,174,.16),transparent 70%) no-repeat,var(--bg);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;min-height:100vh;touch-action:pan-y pinch-zoom;overflow-x:clip;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;margin:0;touch-action:manipulation}
input,select,textarea{font-size:16px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:700;line-height:1.05;text-wrap:balance;font-stretch:88%}
p{margin:0}
a{color:var(--pink-2)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
::selection{background:var(--pink-deep);color:#fff}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:0 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));position:relative;overflow-x:clip;touch-action:pan-y pinch-zoom}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 6px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--pink-2),var(--pink-deep));display:grid;place-items:center;color:#2a0f1c;box-shadow:0 4px 14px rgba(255,111,174,.35)}
.brand .mark svg{width:19px;height:19px}
.brand h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
.brand h1 em{font-style:normal;color:var(--pink)}
.brand small{display:block;font:600 10.5px/1 var(--font-body);color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.top-right{display:flex;align-items:center;gap:8px}
.save-state{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.save-state .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);transition:background .3s}
.save-state.saving .dot{background:var(--warn);animation:blink 1s infinite}
.save-state.saved .dot{background:var(--pink)}
.save-state.error{color:var(--bad);border-color:var(--bad)}
.save-state.error .dot{background:var(--bad)}
.save-state.temp{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.save-state.temp .dot{background:var(--warn)}
@keyframes blink{50%{opacity:.35}}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:background .2s,transform .15s;flex:none}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.4}
.icon-btn svg{width:19px;height:19px}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}
.icon-btn.sm svg{width:15px;height:15px}

.view{animation:viewIn .28s var(--ease) both}
.view.still,.view.still .ex{animation:none}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg-2) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px;height:var(--tabbar-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;position:relative;transition:color .2s}
.tab svg{width:22px;height:22px;transition:transform .25s var(--ease)}
.tab.active{color:var(--pink)}
.tab.active svg{transform:translateY(-1px)}
.tab.active::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--pink);box-shadow:0 0 12px var(--pink)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:12px}
.section{margin:20px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section h2{font:700 12.5px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.section .hint{font-size:12px;color:var(--ink-3);text-align:right}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.faint{color:var(--ink-4)}
.small{font-size:12.5px}
.tiny{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:700}
.display{font-family:var(--font-display);font-weight:700;font-stretch:88%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:13px;font-weight:700;font-size:14.5px;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);transition:transform .15s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--pink);color:#2a0f1c;border-color:var(--pink);box-shadow:0 6px 20px -6px rgba(255,111,174,.6)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn svg{width:16px;height:16px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.type{color:var(--type);border-color:color-mix(in srgb,var(--type) 40%,transparent);background:color-mix(in srgb,var(--type) 12%,transparent)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--type)}
:where(.chip.type,.chip.pick,.ribbon,.day .mk,.readyitem,.starter,.seg button){--type:var(--pink)}
[data-type=glutes]{--type:var(--glutes)}
[data-type=upper]{--type:var(--upper)}
[data-type=legs]{--type:var(--legs)}
[data-type=full]{--type:var(--full)}
[data-type=cardio]{--type:var(--cardio)}
[data-type=weight]{--type:var(--pink-2)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:700;font-size:13.5px;transition:background .2s,color .2s,border-color .2s}
.seg button.on{color:var(--type);border-color:color-mix(in srgb,var(--type) 50%,transparent);background:color-mix(in srgb,var(--type) 15%,var(--surface))}
.daypick{margin-bottom:8px}
.daypick button{flex:1 1 auto;min-width:0}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.expick{margin-bottom:2px}
.chip.pick,.chip.kind{padding:7px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);background:var(--surface);border-color:var(--line)}
.chip.pick.on{color:var(--type);border-color:color-mix(in srgb,var(--type) 50%,transparent);background:color-mix(in srgb,var(--type) 15%,var(--surface-2))}
.chip.kind.on{color:var(--cardio);border-color:color-mix(in srgb,var(--cardio) 50%,transparent);background:color-mix(in srgb,var(--cardio) 14%,var(--surface-2))}
.chip.add{padding:7px 11px;font-size:12.5px;color:var(--ink);cursor:pointer}
.chip.add svg{width:13px;height:13px;color:var(--pink)}
.also{margin-top:12px}
.also .pillrow{margin-top:6px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.input{width:100%;min-width:0;padding:11px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink);outline:none;transition:border-color .2s}
.input:focus{border-color:var(--pink)}
.input.mini{width:64px;flex:none;padding:9px 8px;text-align:center}
textarea.input{min-height:74px;resize:vertical;line-height:1.4}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.stepper{display:grid;grid-template-columns:38px 1fr 38px;align-items:stretch;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;height:44px;min-width:0}
.stepper button{color:var(--ink-2);font-size:20px;font-weight:500;display:grid;place-items:center;transition:background .15s}
.stepper button:active{background:var(--surface-3);color:var(--ink)}
.stepper input{width:100%;min-width:0;text-align:center;background:transparent;border:0;outline:none;font:700 19px/1 var(--font-body);font-variant-numeric:tabular-nums;padding:0}
.stepper input::placeholder{color:var(--ink-4);font-weight:600}

.dots{display:flex;gap:6px}
.dots.wrapdots{flex-wrap:wrap}
.dots button{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-weight:700;font-size:13px;transition:all .18s var(--ease)}
.dots button.on{background:var(--surface-3);border-color:var(--ink-3);color:var(--ink);transform:translateY(-1px)}
.dots button.on.lo{border-color:var(--bad);color:var(--bad)}
.dots button.on.mid{border-color:var(--warn);color:var(--warn)}
.dots button.on.hi{border-color:var(--ok);color:var(--ok)}

.rir{display:flex;gap:4px}
.rir button{min-width:32px;height:32px;padding:0 6px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-size:12.5px;font-weight:700;transition:all .18s var(--ease)}
.rir button.on{background:var(--surface-3);color:var(--ink);border-color:var(--ink-3)}
.rir button.on[data-v="0"]{color:var(--pink);border-color:var(--pink)}
.rir button.on[data-v="1"],.rir button.on[data-v="2"]{color:var(--ok);border-color:var(--ok)}
.rir button.on[data-v="3"],.rir button.on[data-v="4"]{color:var(--warn);border-color:var(--warn)}

.toggle{width:46px;height:28px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .22s var(--ease),background .2s}
.toggle.on{background:var(--pink);border-color:var(--pink)}
.toggle.on::after{transform:translateX(18px);background:#2a0f1c}

/* ---------- train ---------- */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}
.dayhead .date{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1;font-stretch:85%;letter-spacing:-.01em}
.dayhead .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.datepick{position:relative}
.datepick input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}

.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.starter{position:relative;text-align:left;padding:11px 12px 12px;border-radius:var(--radius);background:var(--surface);border:1px solid color-mix(in srgb,var(--type) 22%,var(--line));overflow:hidden;transition:transform .18s var(--ease);min-height:124px;display:flex;flex-direction:column;gap:3px;min-width:0}
.starter::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--type) 30%,transparent),transparent 62%)}
.starter:active{transform:scale(.97)}
.starter .toprow{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:24px;position:relative;margin-bottom:auto}
.starter .t{font-family:var(--font-display);font-size:23px;font-weight:800;font-stretch:85%;position:relative;color:var(--ink);margin-top:14px;line-height:1}
.starter .d{font-size:11.5px;color:var(--ink-2);position:relative;line-height:1.3}
.starter .next{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#2a0f1c;background:var(--type);padding:3px 7px;border-radius:999px;white-space:nowrap}
.starter .ic{color:var(--type);display:grid;place-items:center;margin-left:auto}
.starter .ic svg{width:21px;height:21px}
.cardio-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.starter.mini{min-height:0;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;border-radius:13px}
.starter.mini::before{opacity:.5}
.starter.mini .ic{margin:0;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--type) 16%,transparent);flex:none}
.starter.mini .ic svg{width:16px;height:16px}
.starter.mini .t{font-size:17px;margin:0;display:block;line-height:1.1}
.starter.mini .d{font-size:10.5px;display:block;color:var(--ink-3)}

.weigh{display:flex;flex-direction:column;gap:10px}
.weigh .wicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.weigh .wicon svg{width:18px;height:18px}
.weigh .wt{font-weight:700}
.weighrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.weighrow .unit{color:var(--ink-3);font-weight:700;font-size:14px}
.zone{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding:4px 9px;border-radius:999px;--c:var(--hold);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);white-space:nowrap}
.zone.ontrack{--c:var(--ok)} .zone.fast{--c:var(--warn)} .zone.slow{--c:var(--pink-2)} .zone.up,.zone.none{--c:var(--hold)}
.tile.zone-ontrack .v{color:var(--ok)} .tile.zone-fast .v{color:var(--warn)} .tile.zone-slow .v{color:var(--pink-2)}

.ribbon{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:var(--radius);
  background:linear-gradient(100deg,color-mix(in srgb,var(--type) 24%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--type) 38%,var(--line));margin-bottom:12px}
.ribbon .t{font-family:var(--font-display);font-size:27px;font-weight:800;font-stretch:85%;color:var(--type);line-height:1}
.ribbon .s{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.ribbon .status{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-3)}
.ribbon .status.done{color:var(--ok)}

.readiness{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.readiness .lbl{font-size:13.5px;color:var(--ink-2)}
.readiness .lbl small{display:block;font-size:11px;color:var(--ink-3)}

.ex{padding:0;overflow:hidden;animation:cardIn .4s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ex .head{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px 10px;align-items:start}
.ex .stamp{width:66px;height:66px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:0}
.ex .stamp svg{width:66px;height:66px;display:block}
.ex .name{font-family:var(--font-display);font-size:21px;font-weight:700;font-stretch:88%;line-height:1.05}
.ex .muscles{font-size:12px;color:var(--ink-3);margin-top:3px}
.ex .last{font-size:12.5px;color:var(--ink-2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.ex .last b{color:var(--ink);font-weight:700}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)}
.ex .tools{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex:none}
.ex .tools .icon-btn{width:32px;height:32px;border-radius:9px}
.ex .tools .icon-btn svg{width:16px;height:16px}

.reco{display:flex;align-items:flex-start;gap:10px;margin:0 14px 10px;padding:10px 12px;border-radius:13px;--c:var(--hold);
  background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.reco.increase{--c:var(--ok)} .reco.almost{--c:var(--warn)} .reco.hold{--c:var(--hold)} .reco.caution{--c:var(--warn)} .reco.reduce{--c:var(--bad)} .reco.start{--c:var(--pink-2)} .reco.newload{--c:var(--info)} .reco.plateau{--c:var(--upper)}
.reco .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);flex:none}
.reco .ic svg{width:15px;height:15px}
.reco .t{font-weight:700;color:var(--c);font-size:13.5px;line-height:1.25}
.reco .d{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.38}
.reco.increase .ic{animation:pulseGlow 2.2s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.streak{display:inline-flex;gap:3px;align-items:center;margin-left:auto;flex:none}
.streak i{width:14px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,transparent);display:block}
.streak i.on{background:var(--c)}

.sets{display:grid;gap:8px;padding:0 14px 12px}
.sethead,.set{display:grid;grid-template-columns:44px 1fr 1fr 40px;gap:8px;align-items:center}
.sethead{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 2px}
.set .n{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--ink-3);line-height:1}
.set .n small{display:block;font:800 9px/1.1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--pink);margin-top:3px}
.set .done{width:40px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink-4);display:grid;place-items:center;transition:all .2s var(--ease)}
.set .done svg{width:18px;height:18px}
.set .done.on{background:var(--pink);border-color:var(--pink);color:#2a0f1c}
.set.isdone .stepper{border-color:color-mix(in srgb,var(--pink) 45%,var(--line-2))}
.holdbtn{height:44px;border-radius:12px;background:color-mix(in srgb,var(--pink) 14%,var(--bg-2));border:1px solid color-mix(in srgb,var(--pink) 40%,var(--line-2));color:var(--pink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.holdbtn svg{width:15px;height:15px}
.setrir{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-top:-2px}
.sethead.wide,.set.wide{grid-template-columns:44px 1fr 40px}
.lvlrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:0 14px 10px}
.lvlrow .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stepper.lvl{border-color:color-mix(in srgb,var(--pink) 40%,var(--line-2))}
.stepper.lvl .lvlname{display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;line-height:1.1;color:var(--pink-2);padding:0 4px;min-width:0}
.setrir .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.exfoot{display:flex;gap:8px;padding:0 14px 14px;align-items:center}
.exfoot .btn{flex:1}
.exnote{padding:0 14px 12px}
.finish{margin-top:16px;display:flex;flex-direction:column;gap:10px}

.summary{display:grid;gap:8px}
.summary .item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line)}
.summary .item .n{font-weight:700}
.summary .item .s{font-size:12px;color:var(--ink-3)}

.cardio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardio-grid>*{min-width:0}
.cardio-grid .field.wide{grid-column:1/-1}
.stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:10px 12px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line);min-width:0;overflow:hidden}
.tile .v{font-family:var(--font-display);font-size:25px;font-weight:800;font-stretch:85%;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v.sm{font-size:18px;white-space:normal;line-height:1.1}
.tile .v small{font:700 12px var(--font-body);color:var(--ink-3);margin-left:3px}
.tile .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:6px}
.tile.ok .v{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px;align-items:baseline}
.kv span{color:var(--ink-3)} .kv b{text-align:right;color:var(--ink)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px;gap:8px}
.calhead .m{font-family:var(--font-display);font-size:26px;font-weight:800;font-stretch:85%;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding-bottom:4px}
.day{position:relative;aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:4px;transition:transform .18s var(--ease),background .2s,border-color .2s;overflow:hidden;min-width:0}
.day.pad{background:transparent;border-color:transparent;pointer-events:none}
.day .d{font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1}
.day.today{border-color:color-mix(in srgb,var(--pink) 55%,var(--line))}
.day.today .d{color:var(--pink)}
.day.sel{background:var(--surface-3);border-color:var(--pink);transform:scale(1.04)}
.day .marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;padding:0 3px}
.day .mk{font-size:9px;font-weight:800;letter-spacing:.02em;color:#1d0c15;background:var(--type);border-radius:5px;padding:1px 4px;line-height:1.3}
.day .mk.demo{opacity:.6}
.day.future{opacity:.55}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--type)}
.daydetail{margin-top:14px}
.wlist{display:grid;gap:10px}
.exlist{display:grid;gap:6px;margin-top:8px}
.exline{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);font-size:13.5px;align-items:center}
.exline .reps{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:12.5px}
.exline .w{font-weight:700;text-align:right;white-space:nowrap;font-size:13.5px}
.fail{color:var(--pink)}
.cardioline{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:11px;background:color-mix(in srgb,var(--cardio) 10%,var(--bg-2));border:1px solid color-mix(in srgb,var(--cardio) 30%,var(--line));font-size:13px;color:var(--ink-2)}
.cardioline span{color:var(--cardio);display:grid}
.cardioline svg{width:17px;height:17px}
.cardioline b{color:var(--ink)}
.badge{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding:2px 7px;border-radius:999px;--c:var(--hold);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);vertical-align:middle;white-space:nowrap}
.badge.increase{--c:var(--ok)} .badge.almost{--c:var(--warn)} .badge.caution{--c:var(--warn)} .badge.reduce{--c:var(--bad)} .badge.newload{--c:var(--info)} .badge.plateau{--c:var(--upper)} .badge.start{--c:var(--pink-2)} .badge.demo{--c:var(--ink-3)} .badge.open{--c:var(--warn)} .badge.done{--c:var(--ok)}

/* ---------- progress ---------- */
.chart{position:relative;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:hidden}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--ink-3);font-size:10.5px;font-family:var(--font-body)}
.chart .lbl{fill:var(--ink-2);font-size:11px;font-family:var(--font-body);font-weight:700}
.chart .lbl.hi{fill:var(--ink)}
.chart .line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .line.thin{stroke-width:1.4;opacity:.55}
.chart .line.avg{stroke-width:2.4;stroke-dasharray:5 4}
.chart .pt{fill:var(--surface);stroke-width:2}
.chart .hit{fill:transparent}
.chart .cross{stroke:var(--ink-3);stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:10px;padding:6px 9px;font-size:12px;color:var(--ink);white-space:nowrap;transform:translate(-50%,-112%);opacity:0;transition:opacity .15s;z-index:3;line-height:1.3}
.chart .tip b{font-family:var(--font-display);font-size:15px}
.chart .tip small{color:var(--ink-3)}
.history{display:grid;gap:6px;margin-top:10px}
.hrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);font-size:13px}
.hrow.wrow{grid-template-columns:62px 1fr auto auto}
.hrow .d{color:var(--ink-3);font-variant-numeric:tabular-nums}
.hrow .r{color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:0}
.hrow .w{font-weight:700;text-align:right;white-space:nowrap}
.hrow .w small{font-size:11px;color:var(--ink-3);font-weight:600}
.readylist{display:grid;gap:8px}
.readyitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line);text-align:left;width:100%}
.readyitem .sw{width:8px;height:32px;border-radius:4px;background:var(--type)}
.readyitem .n{font-weight:700;font-size:14px}
.readyitem .s{font-size:12px;color:var(--ink-3)}

/* ---------- body ---------- */
.bodyfig{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 6px;position:relative;overflow:hidden}
.bodyfig::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 40%,rgba(255,111,174,.08),transparent 70%);pointer-events:none}
.bodyfig svg{width:100%;max-width:440px;margin:0 auto;display:block;position:relative}
.bodyfig .cap{display:flex;justify-content:space-around;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:4px}
.body .sil{fill:var(--body)}
.body .hair{fill:var(--hair)}
.body .m{fill:var(--muscle);stroke:var(--muscle-line);stroke-width:.7;stroke-linejoin:round;transition:fill .5s var(--ease),stroke .5s}
.body .m.p{fill:var(--hl);stroke:color-mix(in srgb,var(--hl) 60%,#fff);filter:url(#glow);animation:ignite .9s var(--ease) both}
.body .m.s{fill:color-mix(in srgb,var(--hl) 42%,var(--muscle));stroke:color-mix(in srgb,var(--hl) 40%,var(--muscle-line))}
.body .m.sel{stroke:#fff;stroke-width:1.4}
.body .d{fill:none;stroke:var(--body);stroke-width:1.1;stroke-linecap:round;pointer-events:none}
@keyframes ignite{0%{opacity:.35}60%,100%{opacity:1}}
.body.interactive .m{cursor:pointer}
.heatlegend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);margin:8px 0 2px;flex-wrap:wrap}
.heatlegend .bar{flex:1;min-width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#35262f,#6e2a50,#c2468a,#ff8fc4)}
.musclelist{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);transition:border-color .2s;text-align:left;width:100%}
.mrow.sel{border-color:var(--pink)}
.mrow .n{font-weight:700;font-size:14px}
.mrow .s{font-size:12px;color:var(--ink-3)}
.mrow .v{font-family:var(--font-display);font-size:21px;font-weight:800;font-stretch:85%;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.mrow .v small{font:700 10px var(--font-body);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:3px}
.mrow.zone-grow .v{color:var(--pink)} .mrow.zone-mod .v{color:var(--pink-2)} .mrow.zone-low .v{color:var(--ink-2)} .mrow.zone-none .v{color:var(--ink-4)}
.mbar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;background:var(--ink-3);transition:width .6s var(--ease)}
.zone-grow .mbar i{background:var(--pink)} .zone-mod .mbar i{background:var(--pink-deep)}

/* ---------- guide ---------- */
.guide h2.title{font-size:31px;font-weight:800;font-stretch:85%;margin:10px 0 8px;letter-spacing:-.01em}
.guide .lede{color:var(--ink-2);font-size:15.5px;max-width:60ch}
.guide article{margin-top:24px}
.guide h3{font-size:21px;font-weight:700;margin-bottom:8px;color:var(--pink-2)}
.guide p{margin:0 0 10px;max-width:64ch;color:var(--ink-2)}
.guide p strong,.guide li strong{color:var(--ink)}
.guide ul,.guide ol{margin:0 0 10px;padding-left:20px;color:var(--ink-2);max-width:64ch}
.guide li{margin-bottom:7px}
.guide .ref{font-size:11.5px;font-weight:700;white-space:nowrap}
.guide .ref a,.guide .ref span{color:var(--ink-3);text-decoration:none;border-bottom:1px dotted var(--ink-4)}
.rule{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.rule .k{--c:var(--hold);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);padding:4px 8px;border-radius:999px;height:fit-content;white-space:nowrap}
.rule .k.increase{--c:var(--ok)} .rule .k.almost{--c:var(--warn)} .rule .k.reduce{--c:var(--bad)} .rule .k.plateau{--c:var(--upper)} .rule .k.caution{--c:var(--warn)} .rule .k.newload{--c:var(--info)}
.rule p{margin:0;font-size:13.5px}
.tablewrap{overflow-x:auto}
table.rpe{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 12px}
table.rpe th,table.rpe td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink-2)}
table.rpe th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
table.rpe td:first-child{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--pink)}
.refs{list-style:none;padding:0!important;margin:0;display:grid;gap:8px}
.refs li{display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-radius:11px;background:var(--surface);border:1px solid var(--line);margin:0}
.refs .k{font-family:var(--font-display);font-weight:800;color:var(--pink);font-size:15px}
.refs a{color:var(--pink-2);text-decoration:none;word-break:break-all}

/* ---------- sheet / toast / timer / dialog ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,4,8,.62);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(2px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:24px 24px 0 0;
  transform:translateY(102%);transition:transform .34s var(--ease);padding:8px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 12px}
.sheet h2.title{font-size:25px;font-weight:800;font-stretch:85%;margin-bottom:12px;padding-right:44px}
.sheet .close{position:absolute;top:12px;right:14px}
.setrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .l{font-size:14px}
.setrow .l small{display:block;color:var(--ink-3);font-size:12px}
.exedit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exedit>*{min-width:0}
.exedit .field.wide{grid-column:1/-1}
.mpick{display:flex;flex-wrap:wrap;gap:6px}
.mpick button{padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-3);font-weight:700}
.mpick button.p{color:#2a0f1c;border-color:var(--pink);background:var(--pink)}
.mpick button.s{color:var(--pink-2);border-color:color-mix(in srgb,var(--pink) 45%,transparent);background:color-mix(in srgb,var(--pink) 12%,transparent)}
.exsettings{display:grid;gap:8px}
.exs{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);text-align:left;width:100%}
.exs .n{font-weight:700;font-size:14px}
.exs .s{font-size:12px;color:var(--ink-3)}
.exs svg{width:16px;height:16px;color:var(--ink-3)}

.dialog{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,4,8,.68);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.dialog.open{display:flex;animation:dlgFade .18s var(--ease) both}
@keyframes dlgFade{from{opacity:0}to{opacity:1}}
.dlg-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:18px 16px 14px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:dlgIn .24s var(--ease) both}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.dlg-card h2{font-size:22px;margin-bottom:6px}
.dlg-card p{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.dlg-actions{display:flex;gap:8px;margin-top:16px}
.dlg-actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:13px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-btn{margin-left:10px;padding:3px 9px;border-radius:8px;background:var(--pink-deep);color:#fff;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase}

.timer{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom));transform:translate(-50%,0);z-index:35;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:timerIn .3s var(--ease) both;white-space:nowrap}
@keyframes timerIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.timer .ring{width:40px;height:40px}
.timer .ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.timer .ring circle{fill:none;stroke-width:3.5}
.timer .ring .bg{stroke:var(--line-2)}
.timer .ring .fg{stroke:var(--pink);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer .ring .holdfg{transition:stroke-dashoffset .25s linear}
.timer.over .ring .fg{stroke:var(--warn)}
.timer.hold.past .ring .fg{stroke:var(--ok)}
.timer .t{font-family:var(--font-display);font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-align:center;line-height:1}
.timer .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:block;text-align:center;margin-top:2px}
.timer.hold.past .l{color:var(--ok)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:color-mix(in srgb,var(--pink) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--pink) 35%,var(--line));font-size:13px;color:var(--ink-2);margin-bottom:12px}
.banner>span{color:var(--pink);display:grid}
.banner svg{width:18px;height:18px}
.banner b{color:var(--ink)}
.banner.warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.banner.warn>span{color:var(--warn)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--radius);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:21px;font-weight:700;margin-bottom:4px}
.empty .btn{margin-top:12px}

@media (max-width:430px){
  .starters{gap:8px}
  .starter{min-height:108px;padding:10px 10px 11px}
  .starter .t{font-size:21px;margin-top:10px}
  .starter .d,.starter.mini .d{display:none}
  .set,.sethead{grid-template-columns:34px 1fr 1fr 38px;gap:6px}
  .setrir,.lvlrow{grid-template-columns:34px 1fr;gap:6px}
  .lvlrow{padding:0 10px 10px}
  .sethead.wide,.set.wide{grid-template-columns:34px 1fr 38px}
  .stepper{grid-template-columns:30px 1fr 30px}
  .stepper input{font-size:17px}
  .sets{padding:0 10px 12px}
  .ex .head{padding:12px 10px 10px}
  .reco{margin:0 10px 10px}
  .exfoot{padding:0 10px 14px}
  .exnote{padding:0 10px 12px}
  .rir button{min-width:30px}
  .dots button{width:31px;height:32px}
  .weighrow .stepper{grid-template-columns:34px 1fr 34px}
}

   (Catmull-Rom); the renderer mirrors every right-half path
   across x = 120 so both sides always match.
   ------------------------------------------------------------ */
const _r1 = v => Math.round(v * 10) / 10;
function _curve(pts, closed) {
  const n = pts.length;
  const at = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    d += `C${_r1(p1[0] + (p2[0] - p0[0]) / 6)} ${_r1(p1[1] + (p2[1] - p0[1]) / 6)} ${_r1(p2[0] - (p3[0] - p1[0]) / 6)} ${_r1(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]} ${p2[1]}`;
  }
  return closed ? d + 'Z' : d;
}
const shape = pts => _curve(pts, true);
const line = pts => _curve(pts, false);
/* A chain that starts and ends on the midline; mirrored phantom neighbours keep the midline smooth. */
function halfOutline(pts) {
  const a = pts[1], b = pts[pts.length - 2];
  const ext = [[240 - a[0], a[1]], ...pts, [240 - b[0], b[1]]];
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < ext.length - 2; i++) {
    const p0 = ext[i - 1], p1 = ext[i], p2 = ext[i + 1], p3 = ext[i + 2];
    d += `C${_r1(p1[0] + (p2[0] - p0[0]) / 6)} ${_r1(p1[1] + (p2[1] - p0[1]) / 6)} ${_r1(p2[0] - (p3[0] - p1[0]) / 6)} ${_r1(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]} ${p2[1]}`;
  }
  return d + 'Z';
}

/* ============================================================
   ENGINE — dates, set maths, the progression rules, weekly volume,
   cardio minutes and the weigh-in trend
   ============================================================ */
const D = {
  pad: n => String(n).padStart(2, '0'),
  today() { return D.key(new Date()); },
  key(d) { return `${d.getFullYear()}-${D.pad(d.getMonth() + 1)}-${D.pad(d.getDate())}`; },
  parse(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); },
  add(k, n) { const d = D.parse(k); d.setDate(d.getDate() + n); return D.key(d); },
  weekStart(k) { const d = D.parse(k); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return D.key(d); },
  fmt(k, opts) { return D.parse(k).toLocaleDateString(undefined, opts || { weekday: 'short', day: 'numeric', month: 'short' }); },
  fmtShort(k) { return D.parse(k).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); },
  monthName(y, m) { return new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); },
  now() { return Date.now(); },
};

const Engine = (() => {
  const epley = (w, r) => (w > 0 && r > 0) ? (r === 1 ? w : w * (1 + r / 30)) : 0;
  const roundTo = (v, step) => Math.round(v / step) * step;
  const fmtW = v => (Math.round((+v || 0) * 100) / 100).toString();
  const modeOf = ex => (ex && ex.mode) || 'load';

  function exTargets(ex, settings) {
    return {
      target: ex.target ?? settings.targetReps ?? 10,
      top: ex.top ?? settings.topReps ?? 12,
      floor: ex.floor ?? settings.floorReps ?? 8,
      step: ex.step ?? 2.5,
    };
  }

  /* ---- how a load / result reads for each mode ---- */
  const levelName = (ex, w) => ex.levels[Math.max(0, Math.min(ex.levels.length - 1, Math.round(+w || 0)))];
  function loadText(ex, w, u = 'kg') {
    if (ex.levels) return levelName(ex, w);
    const m = modeOf(ex), each = ex.perHand ? '/hand' : '';
    if (m === 'assisted') return +w > 0 ? `${fmtW(w)} ${u} assist` : 'no assist';
    if (m === 'bodyweight' || m === 'timed') return +w > 0 ? `+${fmtW(w)} ${u}${each}` : 'bodyweight';
    return `${fmtW(w)} ${u}${each}`;
  }
  const repWord = ex => modeOf(ex) === 'timed' ? 'seconds' : 'reps';
  const repUnit = ex => modeOf(ex) === 'timed' ? ' s' : '';
  function scoreInfo(ex, u = 'kg') {
    switch (modeOf(ex)) {
      case 'assisted': return { label: 'Assistance', short: 'Assist', lowerBetter: true, fmt: v => `${fmtW(v)} ${u}`, hint: 'lower = stronger' };
      case 'bodyweight': return { label: 'Best set', short: 'Best', fmt: v => `${Math.round(v)} reps`, hint: 'most reps in one set' };
      case 'timed': return { label: 'Best hold', short: 'Best', fmt: v => `${Math.round(v)} s`, hint: 'longest hold' };
      default: return { label: 'Estimated 1RM', short: 'e1RM', fmt: v => `${Math.round(v)} ${u}`, hint: 'Epley: weight × (1 + reps/30)' };
    }
  }

  /* Stats for one exercise inside one workout. topOverride raises the "beat it" bar (see bigStep). */
  function sessionStats(ex, sets, settings, topOverride) {
    const m = modeOf(ex);
    const valid = (sets || []).filter(s => +s.r > 0 && (m !== 'load' || +s.w > 0))
      .map(s => ({ w: +s.w || 0, r: +s.r, rir: s.rir == null || s.rir === '' ? 2 : +s.rir }));
    if (!valid.length) return null;
    const t = exTargets(ex, settings); const top = topOverride || t.top;
    const ws = valid.map(s => s.w);
    const w = m === 'assisted' ? Math.min(...ws) : Math.max(...ws);
    const work = valid.length >= 2 ? valid.slice(0, -1) : valid;
    const last = valid[valid.length - 1];
    const workHit = work.every(s => s.r >= t.target);
    const workEasy = work.every(s => s.rir >= 3);
    const finalHit = last.r >= top;
    const hit = workHit && (finalHit || (workEasy && last.r >= t.target));
    const under = last.r < t.floor || work.some(s => s.r < t.floor);
    const best = Math.max(...valid.map(s => s.r));
    let score;
    if (m === 'load') score = Math.max(...valid.map(s => epley(s.w, s.r)));
    else if (m === 'assisted') score = w;
    else score = best;
    return {
      w, sets: valid, work, last, workHit, workEasy, finalHit, hit, under, n: valid.length, top, best, score,
      e1rm: m === 'load' ? score : 0,
      reps: valid.reduce((a, s) => a + s.r, 0),
      repsText: valid.map(s => s.r).join(' · ') + repUnit(ex),
    };
  }

  /* The progression decision for an exercise, given its completed history (ascending by date). */
  function evaluate(ex, history, settings, readiness) {
    const m = modeOf(ex);
    const t = exTargets(ex, settings);
    const base = { ex, mode: m, target: t.target, top: t.top, floor: t.floor, step: t.step, streak: 0, lowReadiness: false };
    if (readiness) {
      // soreness is inverted (5 = very sore), so 6 − soreness puts it on the same "good = high" scale
      const parts = [];
      if (readiness.energy) parts.push(+readiness.energy);
      if (readiness.sleep) parts.push(+readiness.sleep);
      if (readiness.soreness) parts.push(6 - +readiness.soreness);
      if (parts.length) { base.readinessScore = parts.reduce((a, v) => a + v, 0) / parts.length; base.lowReadiness = base.readinessScore <= 2.4; }
    }
    let S = history.map(h => ({ ...h, st: sessionStats(ex, h.sets, settings) })).filter(h => h.st);
    base.sessions = S.length;
    if (!S.length) return { ...base, status: 'start', w: ex.weight || 0, next: ex.weight || 0, score: 0 };

    const w = S[S.length - 1].st.w;
    // Light loads: a fixed machine step (5 kg on a 20 kg stack = 25%) is far beyond the ACSM 2–10%.
    // Ask for three extra reps on the final set before moving up, so the jump lands inside the rep range.
    const bigStep = m === 'load' && w > 0 && t.step / w > 0.12;
    const top = bigStep ? t.top + 3 : t.top;
    if (bigStep) S = history.map(h => ({ ...h, st: sessionStats(ex, h.sets, settings, top) })).filter(h => h.st);

    const last = S[S.length - 1], prev = S[S.length - 2];
    const streakOf = pred => { let n = 0; for (let i = S.length - 1; i >= 0; i--) { if (pred(S[i].st) && S[i].st.w === w) n++; else break; } return n; };
    const streak = streakOf(st => st.hit);
    const underStreak = streakOf(st => st.under);
    const sameW = streakOf(() => true);
    // plateau = no rep gain across the last four sessions at this load
    const ref = S[S.length - 4];
    const stalled = sameW >= 4 && last.st.reps <= ref.st.reps && !last.st.hit;
    const topLevel = ex.levels ? ex.levels.length - 1 : 0;
    const harder = m === 'assisted' ? (a, b) => a < b : (a, b) => a > b;   // is load a harder than b?
    const justIncreased = !!prev && harder(w, prev.st.w) && sameW === 1;
    const pct = m === 'load' && w > 0 ? (t.step / w) * 100 : 0;

    let status, next = w;
    if (streak >= 2) { status = 'increase'; next = ex.levels ? Math.min(topLevel, w + 1) : m === 'assisted' ? Math.max(0, w - t.step) : w + t.step; }
    else if (streak === 1) status = 'almost';
    else if (underStreak >= 2) {
      status = 'reduce';
      if (ex.levels) next = Math.max(0, w - 1);
      else if (m === 'assisted') next = w + (t.step || 5);
      else if (m === 'load') next = Math.max(t.step, Math.min(w - t.step, roundTo(w * 0.95, t.step || 1)));
      else next = Math.max(0, w - t.step);
    }
    else if (last.st.under) status = 'caution';
    else if (stalled) status = 'plateau';
    else if (justIncreased) status = 'newload';
    else status = 'hold';

    const scores = S.map(s => s.st.score);
    const prevScore = prev ? prev.st.score : 0;
    const dir = m === 'assisted' ? -1 : 1;
    const trend = prevScore ? ((last.st.score - prevScore) / prevScore) * 100 * dir : 0;
    const bestScore = m === 'assisted' ? Math.min(...scores) : Math.max(...scores);
    const earlierBest = S.length > 1 ? (m === 'assisted' ? Math.min(...scores.slice(0, -1)) : Math.max(...scores.slice(0, -1))) : null;
    const isPR = earlierBest != null && (m === 'assisted' ? last.st.score < earlierBest : last.st.score > earlierBest);
    return { ...base, top, bigStep, status, w, next, pct, streak, underStreak, sameW, stalled, justIncreased,
      score: last.st.score, prevScore, trend, bestScore, isPR, e1rm: last.st.e1rm,
      last: last.st, lastDate: last.date, prev: prev ? prev.st : null };
  }

  /* Human wording for a decision */
  function describe(ev, units) {
    const u = units || 'kg'; const ex = ev.ex; const m = ev.mode || modeOf(ex);
    const t = ev.target, top = ev.top, floor = ev.floor;
    const unit = repUnit(ex), word = repWord(ex);
    const L = w => loadText(ex, w, u);
    const step = fmtW(ev.step);
    const pct = ev.pct ? ` (≈${ev.pct.toFixed(ev.pct < 10 ? 1 : 0)}%)` : '';
    const tip = ex.tip ? ` Next level: ${ex.tip}.` : '';
    const low = ev.lowReadiness ? ' Energy looks low today, so repeating it once more is also fine.' : '';
    if (ex.levels) {
      const cur = levelName(ex, ev.w), nxt = levelName(ex, ev.next);
      if (ev.status === 'start') return { title: 'First time — pick your version', detail: `Use − / + to choose the version (now: ${cur}). Aim for ${t}${unit} on the first two sets with a little left in the tank, then go all out on the last.` };
      if (ev.status === 'increase') return ev.next > ev.w
        ? { title: `Level up → ${nxt}`, detail: `Two sessions in a row you hit ${t}+${unit} and ${top}+${unit} on the final set at "${cur}". Switch to "${nxt}" — expect fewer ${word} at first, then build back.${low}` }
        : { title: `Top version — keep adding ${word}`, detail: `You've reached the hardest version here. Keep pushing ${word} on the final set, or slow every rep down.` };
      if (ev.status === 'newload') return { title: 'New version — settle in', detail: `First session at "${cur}". Fewer ${word} are normal for a session or two; build back to ${t}${unit} and ${top}+${unit}.` };
      if (ev.status === 'reduce') return { title: `Step back → ${nxt}`, detail: `Two sessions in a row under ${floor}${unit} at "${cur}". The easier version keeps you in the ${floor}–${top}${unit} range so you can climb again.` };
      if (ev.status === 'hold') return { title: `Stay on "${cur}" — chase ${word}`, detail: `You're in the productive zone. Push the final set toward ${top}+${unit}; two sessions there and you move up a version.` };
      if (ev.status === 'caution') return { title: `Below the floor — stay on "${cur}"`, detail: `A set fell under ${floor}${unit}. Keep this version and focus on ${word}; if it happens again the app suggests an easier one.` };
      if (ev.status === 'plateau') return { title: `Plateau at "${cur}"`, detail: `No extra ${word} over the last few sessions. Take a lighter week, add a set, or check sleep and food — then push again.` };
    }
    switch (ev.status) {
      case 'start':
        if (m === 'bodyweight') return { title: 'First time — bodyweight is fine', detail: `Aim for ${t} reps on the first two sets with 1–3 left in the tank, then as many good reps as you can on the last. Knee or incline versions count — add a note so you know which one you did.` };
        if (m === 'assisted') return { title: 'First time — pick the assistance', detail: `Set the counterweight so ${t} reps leave 1–3 in the tank; more assistance = easier. Type it into set 1. The app tells you when to take some off.` };
        if (m === 'timed') return { title: 'First time — hold for time', detail: `Hold each set with a straight line from shoulders to heels, aiming for about ${t} s on the first two and as long as you can on the last. Tap ▶ to time it.` };
        return ev.w
          ? { title: `Start at ${fmtW(ev.w)} ${u}`, detail: `Aim for ${t} reps on each working set with 1–3 in reserve, then take the final set to failure. The app tells you when to add weight.` }
          : { title: 'First time — pick a weight', detail: `Choose a load where ${t} reps leave 1–3 in the tank, type it into set 1, then take the final set to failure. From the next session on the app tracks it.` };
      case 'increase':
        if (m === 'assisted') return ev.next > 0
          ? { title: `Take ${step} ${u} off → ${fmtW(ev.next)} ${u} assist`, detail: `Two sessions in a row you hit ${t}+ reps and ${top}+ on the final set at ${fmtW(ev.w)} ${u} of assistance. Less help next time — reps will dip, then climb back.${low}` }
          : { title: 'Try it with no assistance!', detail: `Two sessions in a row at ${top}+ reps on the lightest assistance. Go for real pull-ups; if you only get a few, keep a little help on the later sets.` };
        if (m === 'timed') return { title: 'Level up the hold', detail: `Two sessions in a row you held ${top}+ s on the final set. Aim about 10 s longer, or${tip ? ' ' + ex.tip : ' make it harder'}.` };
        if (m === 'bodyweight') return ev.step > 0
          ? { title: `Level up: add ${step} ${u}${ex.perHand ? ' per hand' : ''}`, detail: `Two sessions in a row you hit ${t}+ reps and ${top}+ on the final set at ${L(ev.w)}. Time to ${ex.tip || 'add a little load'}.${low}` }
          : { title: 'Level up: harder version', detail: `Two sessions in a row you hit ${t}+ reps and ${top}+ on the final set.${tip}${low}` };
        return { title: `Add ${step} ${u} → ${fmtW(ev.next)} ${u}${pct}`, detail: `Two sessions in a row you hit ${t}+ on the working sets and ${top}+ on the final set at ${fmtW(ev.w)} ${u}. That is the 2-for-2 rule — move up and rebuild your reps.${ev.bigStep ? ` Because ${step} ${u} is a big jump at this weight, the target was ${top} reps, not ${ev.top - 3}.` : ''}${low}` };
      case 'almost': return { title: '1 of 2 — repeat this and you move up', detail: `Last session hit the targets (${t}+ ${word} on the working sets, ${top}+${unit} on the final set). Do it once more at ${L(ev.w)} and you level up.` };
      case 'hold': return { title: `Hold ${L(ev.w)} — chase ${word}`, detail: `You are in the productive zone (working sets ≥ ${floor}${unit}, final set under ${top}${unit}). Adding ${word} at the same load builds muscle just like adding weight; push the final set toward ${top}+${unit}.${ev.bigStep ? ` The machine's ${step} ${u} jump is big at this weight, so the bar is ${top} reps before moving up.` : ''}` };
      case 'newload':
        if (m === 'assisted') return { title: 'Less assistance — settle in', detail: `First session at ${fmtW(ev.w)} ${u} of help. Reps usually dip for a session or two; rebuild to ${t} and ${top}+ on the last set.` };
        if (m === 'bodyweight' || m === 'timed') return { title: 'Harder version — settle in', detail: `First session at ${L(ev.w)}. Expect fewer ${word} for a session or two, then build back up.` };
        return { title: 'New weight — settle in', detail: `First session at ${fmtW(ev.w)} ${u}. Expect fewer reps for a session or two; rebuild to ${t} on the working sets and ${top}+ on the final set.` };
      case 'caution': return { title: `Below the floor — keep ${L(ev.w)}`, detail: `A set fell under ${floor}${unit}. Keep the same load and focus on ${word}. If it happens again the app suggests an easier setting.` };
      case 'reduce':
        if (m === 'assisted') return { title: `Add help → ${fmtW(ev.next)} ${u} assist`, detail: `Two sessions in a row under ${floor} reps. A little more assistance gets you back into the ${floor}–${top} range to build from.` };
        if (m === 'timed' || (m === 'bodyweight' && !(ev.w > 0))) return { title: 'Try an easier version for now', detail: `Two sessions in a row under ${floor}${unit}. Use an easier version (knees, incline, shorter lever) until you are back in the ${floor}–${top}${unit} range.` };
        return { title: `Drop to ${L(ev.next)} and rebuild`, detail: `Two sessions in a row under ${floor} reps at ${L(ev.w)} — the load is ahead of your recovery. A small step back gets you into the ${floor}–${top} range to climb again.` };
      case 'plateau': return { title: `Plateau — ${ev.sameW} sessions at ${L(ev.w)}`, detail: `Your total ${word} have not moved. Options with evidence behind them: take a lighter week (about half the sets — a one-week deload does not cost muscle), add one extra set, or check sleep and food. Then push again.` };
    }
    return { title: '', detail: '' };
  }

  /* Weekly sets per muscle (fractional: secondary = 0.5). */
  function weeklyMuscleSets(workouts, exercises, weekStartKey) {
    const end = D.add(weekStartKey, 7);
    const out = {}; Object.keys(MUSCLES).forEach(m => out[m] = { sets: 0, from: {} });
    const exById = Object.fromEntries(exercises.map(e => [e.id, e]));
    Object.values(workouts).forEach(w => {
      if (w.date < weekStartKey || w.date >= end || !DAY_TYPES[w.type]?.lifting) return;
      (w.entries || []).forEach(en => {
        const ex = exById[en.ex]; if (!ex) return;
        const n = (en.sets || []).filter(s => +s.r > 0 && (modeOf(ex) !== 'load' || +s.w > 0)).length; if (!n) return;
        const add = (m, v) => { if (out[m]) { out[m].sets += v; out[m].from[ex.name] = (out[m].from[ex.name] || 0) + v; } };
        (ex.primary || []).forEach(m => add(m, n));
        (ex.secondary || []).forEach(m => add(m, n * 0.5));
      });
    });
    return out;
  }
  function zone(sets, goal) { return sets >= goal ? 'grow' : sets >= 4 ? 'mod' : sets > 0 ? 'low' : 'none'; }

  /* Cardio minutes per week (from every session's cardio block) + stretching days */
  function cardioWeeks(workouts, n = 8) {
    const byWeek = {};
    Object.values(workouts).forEach(w => {
      const k = D.weekStart(w.date);
      const wk = byWeek[k] = byWeek[k] || { week: k, min: 0, load: 0, sessions: 0, stretch: 0, kinds: {} };
      const c = w.cardio;
      if (c && +c.min > 0) { wk.min += +c.min; wk.load += (+c.rpe || 0) * +c.min; wk.sessions++; if (c.kind) wk.kinds[c.kind] = (wk.kinds[c.kind] || 0) + +c.min; }
      if (w.stretch && w.stretch.done) wk.stretch++;
    });
    const thisWeek = D.weekStart(D.today()); const out = [];
    for (let i = n - 1; i >= 0; i--) { const k = D.add(thisWeek, -7 * i); out.push(byWeek[k] || { week: k, min: 0, load: 0, sessions: 0, stretch: 0, kinds: {} }); }
    return out;
  }

  /* Weigh-ins: a 7-day average smooths out water, salt and cycle swings */
  function bwSeries(bw) {
    return Object.entries(bw || {}).filter(([, v]) => v && +v.kg > 0)
      .map(([date, v]) => ({ date, kg: +v.kg, demo: !!v.demo })).sort((a, b) => a.date < b.date ? -1 : 1);
  }

/* ---------------- anatomy renderer ---------------- */
const Body = (() => {
  const W = BODY.W;

    return `M${x + r} ${y}L${x + w - r} ${y}Q${x + w} ${y} ${x + w} ${y + r}L${x + w} ${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}L${x + r} ${y + h}Q${x} ${y + h} ${x} ${y + h - r}L${x} ${y + r}Q${x} ${y} ${x + r} ${y}Z`;

      const arr = nums.trim().split(/[\s,]+/).map(Number); const out = [];
      for (let i = 0; i < arr.length; i += 2) out.push(`${_r1(W - arr[i])} ${arr[i + 1]}`);

  }

    return `rgb(${STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f)).join(',')})`;
  }

    let s = `<g transform="translate(${dx},0)"><circle class="hair" cx="${b.cx}" cy="${b.cy}" r="${b.r}"/>`;
    s += `<path class="sil" d="${BODY.silhouette}"/><path class="sil" d="${mirror(BODY.silhouette)}"/>`;
    BODY.hair[view].forEach(d => { s += `<path class="hair" d="${d}"/>`; });
    Object.entries(muscles).forEach(([m, paths]) => {
      const cls = ['m'];

      paths.forEach(p => { const d = expand(p); s += `<path class="${cls.join(' ')}" data-m="${m}" d="${d}"${style}/><path class="${cls.join(' ')}" data-m="${m}" d="${mirror(d)}"${style}/>`; });

  function svg(o = {}) {

    views.forEach((v, i) => { s += group(v, i * W, opts); });

/* ---------------- charts (plain SVG) ---------------- */
const Chart = (() => {
  const W = 600, H = 220, P = { l: 38, r: 14, t: 16, b: 28 };
  function scale(vals, pad = 0.12) {
    let min = Math.min(...vals), max = Math.max(...vals);
    if (!isFinite(min)) { min = 0; max = 1; }
    if (max === min) { max = min + 1; min = min - 1; }
    const span = max - min; return { min: min - span * pad, max: max + span * pad };
  }
  function ticks(min, max, n = 4) {
    const span = max - min; const raw = span / n; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const norm = raw / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const out = []; for (let v = Math.ceil(min / step) * step; v <= max; v += step) out.push(+v.toFixed(6)); return out;
  }
  /* points: [{x:label, y:number}]; o.extra: second series [{y}] drawn as a dashed line; o.band: [lo, hi] shaded */
  function line(points, o = {}) {

    const ys = points.map(p => p.y).concat(o.extra ? o.extra.filter(p => p.y != null).map(p => p.y) : []); const sc = scale(ys);
    const n = points.length; const iw = W - P.l - P.r; const ih = H - P.t - P.b;
    const X = i => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const Y = v => P.t + ih - ((v - sc.min) / (sc.max - sc.min)) * ih;

    let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
    s += '<g class="grid">'; ticks(sc.min, sc.max).forEach(t => { s += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/>`; }); s += '</g>';
    s += '<g class="axis">'; ticks(sc.min, sc.max).forEach(t => { s += `<text x="${P.l - 6}" y="${Y(t) + 4}" text-anchor="end">${o.fmt ? o.fmt(t) : t}</text>`; }); s += '</g>';
    const path = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join('');
    if (!o.extra) s += `<path class="area" d="${path}L${X(n - 1).toFixed(1)} ${(P.t + ih).toFixed(1)}L${X(0).toFixed(1)} ${(P.t + ih).toFixed(1)}Z" fill="url(#${id})"/>`;
    s += `<path class="line${o.extra ? ' thin' : ''}" d="${path}" style="stroke:${col}"/>`;
    if (o.extra) { const ep = o.extra.map((p, i) => p.y == null ? '' : `${o.extra.slice(0, i).some(q => q.y != null) ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(''); s += `<path class="line avg" d="${ep}" style="stroke:${o.extraColor || 'var(--ink)'}"/>`; }
    s += `<line class="cross" y1="${P.t}" y2="${P.t + ih}" x1="0" x2="0"/>`;
    if (!o.noDots || n <= 14) points.forEach((p, i) => { s += `<circle class="pt${i === n - 1 ? ' last' : ''}" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i === n - 1 ? 5 : o.extra ? 2.5 : 4}" style="stroke:${col}${i === n - 1 ? ';fill:' + col : ''}"/>`; });
    else s += `<circle class="pt last" cx="${X(n - 1).toFixed(1)}" cy="${Y(points[n - 1].y).toFixed(1)}" r="5" style="stroke:${col};fill:${col}"/>`;
    const every = Math.max(1, Math.ceil(n / 5));
    s += '<g class="axis">'; points.forEach((p, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(p.x)}</text>`; }); s += '</g>';
    points.forEach((p, i) => { const x0 = i === 0 ? P.l : (X(i - 1) + X(i)) / 2; const x1 = i === n - 1 ? W - P.r : (X(i) + X(i + 1)) / 2; s += `<rect class="hit" x="${x0.toFixed(1)}" y="${P.t}" width="${(x1 - x0).toFixed(1)}" height="${ih}" data-i="${i}" data-cx="${X(i).toFixed(1)}" data-cy="${Y(p.y).toFixed(1)}"/>`; });

  }
  /* bars: [{x, y, label, color}] */

    const n = items.length; const iw = W - P.l - P.r; const ih = H - P.t - P.b;
    const bw = Math.min(56, (iw / n) * 0.62); const X = i => P.l + ((i + 0.5) / n) * iw; const Y = v => P.t + ih - ((v - min) / (max - min)) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;

    s += '<g class="axis">'; ticks(min, max).forEach(t => { s += `<text x="${P.l - 6}" y="${Y(t) + 4}" text-anchor="end">${o.fmt ? o.fmt(t) : t}</text>`; }); s += '</g>';

      s += `<rect class="hit" x="${(P.l + (i / n) * iw).toFixed(1)}" y="${P.t}" width="${(iw / n).toFixed(1)}" height="${ih}" data-i="${i}" data-cx="${X(i).toFixed(1)}" data-cy="${Y(p.y).toFixed(1)}"/>`;
    });
    if (o.goal != null) s += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1.4"/><text class="lbl" x="${W - P.r}" y="${Y(o.goal) - 5}" text-anchor="end" style="fill:var(--ok)">${esc(o.goalLabel || '')}</text>`;
    const every = Math.max(1, Math.ceil(n / 8));
    s += '<g class="axis">'; items.forEach((p, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(p.x)}</text>`; }); s += '</g>';
    return `<div class="chart">${s}</svg><div class="tip"></div></div>`;

      if (cross) { cross.setAttribute('x1', hit.dataset.cx); cross.setAttribute('x2', hit.dataset.cx); cross.style.opacity = 1; }
    };

    ch.addEventListener('pointermove', e => { const t = e.target.closest('.hit'); if (t) show(t); });
    ch.addEventListener('pointerdown', e => { const t = e.target.closest('.hit'); if (t) show(t); });

  return { line, bars, bind };
})();

/* Rest countdown after a set, or a count-up stopwatch for timed holds (plank). */
const Timer = (() => {
  let end = 0, total = 0, tick = null, ctx = null, holdStart = 0, holdTarget = 0, onHold = null;
  const R = 17, C = 2 * Math.PI * R;
  function beep(freq = 880) {
    try {
      if (!Store.state.settings.timerSound) return;
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18, 0.36].forEach(t => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = freq; g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.14); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.16); });
    } catch (e) { /* no audio, fine */ }
  }
  function prime() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { } }
  const ring = (frac, cls) => `<div class="ring"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="${R}"/><circle class="fg${cls ? ' ' + cls : ''}" cx="20" cy="20" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/></svg></div>`;
  const mmss = s => `${Math.floor(s / 60)}:${D.pad(s % 60)}`;
  function render() {
    const host = $('#timerHost');
    if (holdStart) {
      const secs = Math.floor((Date.now() - holdStart) / 1000); const past = holdTarget && secs >= holdTarget;
      host.innerHTML = `<div class="timer hold${past ? ' past' : ''}" role="timer" aria-live="off">${ring(holdTarget ? Math.min(1, secs / holdTarget) : 0, 'holdfg')}
        <div><div class="t">${mmss(secs)}</div><span class="l">${past ? 'Past target!' : holdTarget ? `Target ${holdTarget} s` : 'Holding'}</span></div>
        <button class="btn sm primary" data-timer="stop">Stop</button></div>`;
      return;
    }
    if (!end) { host.innerHTML = ''; return; }
    const left = Math.round((end - Date.now()) / 1000);
    const over = left < 0;
    host.innerHTML = `<div class="timer${over ? ' over' : ''}" role="timer" aria-live="off">${ring(over ? 1 : Math.max(0, 1 - left / total))}
      <div><div class="t">${over ? '+' : ''}${mmss(Math.abs(left))}</div><span class="l">${over ? 'Next set' : 'Rest'}</span></div>
      <button class="btn sm" data-timer="add">+30s</button><button class="btn sm ghost" data-timer="stop">Done</button></div>`;
  }
  function start(sec) {
    if (holdStart) return;
    prime(); total = sec; end = Date.now() + sec * 1000; clearInterval(tick); render();
    tick = setInterval(() => { const left = Math.round((end - Date.now()) / 1000); render(); if (left === 0) beep(); if (left < -600) stop(); }, 1000);
  }
  function hold(target, cb) {
    prime(); clearInterval(tick); end = 0; holdStart = Date.now(); holdTarget = target || 0; onHold = cb; render();
    let beeped = false;
    tick = setInterval(() => { render(); if (!beeped && holdTarget && Date.now() - holdStart >= holdTarget * 1000) { beeped = true; beep(1175); } }, 250);
  }
  function stop() {
    clearInterval(tick); tick = null;
    if (holdStart) { const secs = Math.floor((Date.now() - holdStart) / 1000); const cb = onHold; holdStart = 0; onHold = null; render(); if (cb) cb(secs); return; }
    end = 0; render();
  }
  function add(sec) { if (!end) return; end += sec * 1000; total += sec; render(); }
  return { start, hold, stop, add, get running() { return !!end || !!holdStart; } };
})();

  html += `<div class="starters">` + ROTATION.map(k => { const t = DAY_TYPES[k]; const isNext = k === next && !ws.some(x => x.type === k);
    return `<button class="starter" data-type="${k}" data-act="start" data-typ="${k}"><span class="toprow">${isNext ? '<span class="next">Up next</span>' : ''}<span class="ic">${DAY_ICON[k]}</span></span><span class="t">${t.name}</span><span class="d">${t.desc}</span></button>`; }).join('') + `</div>`;
  html += `<div class="cardio-row">` + ['full', 'cardio'].map(k => `<button class="starter mini" data-type="${k}" data-act="start" data-typ="${k}"><span class="ic">${DAY_ICON[k]}</span><span class="grow"><span class="t">${DAY_TYPES[k].name}</span><span class="d">${DAY_TYPES[k].desc}</span></span></button>`).join('') + `</div>`;

  const st = weekStats();
  const entry = S.bodyweight[date];
  const zone = Engine.bwZone(st.rate);
  html += `<div class="section"><h2>This week</h2><span class="hint">${D.fmtShort(D.weekStart(D.today()))} – ${D.fmtShort(D.add(D.weekStart(D.today()), 6))}</span></div>

      <div class="tile${st.cardio >= S.settings.cardioGoal ? ' ok' : ''}"><div class="v">${st.cardio}<small>/ ${S.settings.cardioGoal}</small></div><div class="l">Cardio min</div></div>
      <div class="tile"><div class="v">${st.stretch}</div><div class="l">Stretches</div></div>
    </div>
    <div class="card weigh" style="margin-top:10px">
      <div class="row between"><div class="row"><span class="wicon">${ICON.scale}</span><div><div class="wt">Weigh-in</div><div class="small muted">${isToday ? 'Today' : D.fmt(date)}${entry ? ' · saved' : ''}</div></div></div><span class="zone ${zone}">${ZONE_WORD[zone]}</span></div>
      <div class="weighrow"><div class="stepper"><button data-bwstep="-1" aria-label="Minus 0.1 kg">−</button><input type="number" inputmode="decimal" step="0.1" min="30" max="250" id="bwInput" value="${entry ? entry.kg : ''}" placeholder="${Store.latestWeight() ? fmtW(Store.latestWeight()) : 'kg'}" aria-label="Weight in kg"><button data-bwstep="1" aria-label="Plus 0.1 kg">+</button></div><span class="unit">kg</span><button class="btn primary" data-act="bw-save">${entry ? 'Update' : 'Save'}</button></div>
      <p class="small muted">${st.avg ? `7-day average <b style="color:var(--ink-2)">${st.avg.toFixed(1)} kg</b> · ` : ''}${rateText(st.rate)}. Watch the average, not single days — water, salt and your cycle all move the scale.</p>
    </div>`;
  if (!Store.allWorkouts().length) html += `<div class="empty" style="margin-top:14px"><b>Your first session</b>Pick a day above. Every exercise starts blank — type the weight you use, and the app works out when to go up from there.<br><button class="btn sm" data-act="load-demo">Preview with sample data</button></div>`;
  return html;
}

function workoutRow(w) {

  const bits = [];

function renderWorkout(w) {

  let html = `<div class="ribbon" data-type="${w.type}"><div><div class="t">${t.name}</div><div class="s">${D.fmt(w.date, { weekday: 'long', day: 'numeric', month: 'long' })}${w.demo ? ' · sample' : ''}</div></div>
    <div class="row"><span class="status${w.status === 'done' ? ' done' : ''}">${w.status === 'done' ? 'Finished ✓' : 'In progress'}</span><button class="btn sm ghost" data-act="close-workout">Back</button></div></div>`;
  html += `<div class="card"><div class="section" style="margin:0 0 10px"><h2>How do you feel?</h2><span class="hint">shapes the advice</span></div><div class="readiness">`;

  });
  html += `</div></div>`;

    html += `<div class="section"><h2>Exercises</h2><span class="hint">sets 1–2: ~${S.settings.targetReps} reps, 1–3 in reserve · last set: all out</span></div><div class="stack" id="exStack">`;
    (w.entries || []).forEach((en, i) => { html += renderExerciseCard(w, en, i); });
    html += `</div>`;
    const have = new Set((w.entries || []).map(e => e.ex));

    html += `<div class="row" style="margin-top:10px"><button class="btn ghost block" data-act="add-exercise">${ICON.plus} Add an exercise from another day</button></div>`;
  }

  html += `<div class="section"><h2>Session</h2></div><div class="card stack">
    <div><div class="tiny" style="margin-bottom:6px">Whole-session effort (RPE 1–10)</div>${rpeDots('data-srpe="1"', w.sessionRPE)}</div>
    <div class="field"><label for="wnote">Notes</label><textarea class="input" id="wnote" data-wfield="note" placeholder="Anything worth remembering — sleep, form cues, how the new weight felt…">${esc(w.note || '')}</textarea></div>

    <button class="btn ghost danger block" data-act="delete-workout">${ICON.trash} Delete this session</button></div>`;
  return html;
}
